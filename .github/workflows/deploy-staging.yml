# .github/workflows/deploy-staging.yml
# Deploy to Staging Environment
# Automatically deploys on push to main

name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (image tag)'
        required: false
        default: 'latest'

env:
  GKE_CLUSTER: aivo-gke-staging
  GKE_ZONE: us-central1-c
  PROJECT_ID: aivo-learning
  NAMESPACE: aivo-staging

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # DEPLOY
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" && "${{ github.event.inputs.version }}" != "latest" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="main-$(git rev-parse --short=8 HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tags
        run: |
          cd infra/k8s/overlays/staging

          # TEMP (2026-02-05): Only update ai-orchestrator image in staging.
          # Revert by restoring the full SERVICES list for all services.
          SERVICES=(
            "ai-orchestrator"
          )

          for service in "${SERVICES[@]}"; do
            echo "Setting image for $service to gcr.io/${{ env.PROJECT_ID }}/${service}:${{ steps.version.outputs.version }}"
            # Use aivo/<service> as the image name since that's what's defined in deployment manifests
            # kustomize will remap to gcr.io/aivo-platform/<service>:<tag>
            kustomize edit set image aivo/${service}=gcr.io/${{ env.PROJECT_ID }}/${service}:${{ steps.version.outputs.version }}
          done

      - name: Deploy to Kubernetes
        run: |
          echo "::group::Applying Kubernetes manifests"
          kustomize build infra/k8s/overlays/staging | kubectl apply -f -
          echo "::endgroup::"
          
          echo "::group::Waiting for rollout"
          # TEMP (2026-02-05): Only wait for ai-orchestrator rollout in staging.
          # Revert by restoring the loop over all deployments.
          kubectl rollout status deployment/ai-orchestrator -n ${{ env.NAMESPACE }} --timeout=600s
          echo "::endgroup::"

      - name: Verify deployment
        run: |
          echo "::group::Pod Status"
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          echo "::endgroup::"
          
          echo "::group::Service Status"
          kubectl get svc -n ${{ env.NAMESPACE }}
          echo "::endgroup::"

      - name: Run smoke tests
        run: |
          # Wait for services to be ready
          sleep 30

          # Health check core services with correct per-service ports
          declare -A PORTS=(
            ["auth-svc"]=4001
            ["session-svc"]=4020
            ["content-svc"]=4020
            ["assessment-svc"]=3031
            ["ai-orchestrator"]=4010
            ["analytics-svc"]=4030
            ["notify-svc"]=4040
            ["messaging-svc"]=4041
            ["goal-svc"]=4030
            ["focus-svc"]=4026
            ["billing-svc"]=4060
            ["payments-svc"]=4070
            ["parent-svc"]=3010
            ["baseline-svc"]=4011
            ["consent-svc"]=4004
            ["profile-svc"]=3420
            ["personalization-svc"]=3012
            ["life-skills-svc"]=4050
          )
          FAILED=0
          for svc in "${!PORTS[@]}"; do
            PORT=${PORTS[$svc]}
            if kubectl exec -n ${{ env.NAMESPACE }} deploy/$svc -- curl -sf http://localhost:$PORT/health 2>/dev/null; then
              echo "OK: $svc (port $PORT)"
            else
              echo "Warning: $svc health check failed (port $PORT)"
              FAILED=$((FAILED + 1))
            fi
          done
          echo "Smoke tests complete: $FAILED service(s) failed"
        continue-on-error: true

      - name: Notify on success
        if: ${{ success() && secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ Staging deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Staging Deployment Successful*\n\n*Version:* `${{ steps.version.outputs.version }}`\n*Commit:* `${{ github.sha }}`\n*Actor:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Staging" },
                      "url": "https://staging.aivo.ai"
                    },
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Workflow" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

      - name: Notify on failure
        if: ${{ failure() && secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ Staging deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Staging Deployment Failed*\n\n*Version:* `${{ steps.version.outputs.version }}`\n*Commit:* `${{ github.sha }}`\n*Actor:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Logs" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

  # ════════════════════════════════════════════════════════════════════════════
  # RUN MIGRATIONS
  # ════════════════════════════════════════════════════════════════════════════
  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Run migrations
        run: |
          # Create migration job
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migrate-${{ github.run_number }}
            namespace: ${{ env.NAMESPACE }}
          spec:
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: gcr.io/${{ env.PROJECT_ID }}/db-migrations:${{ needs.deploy.outputs.version }}
                    command: ["npm", "run", "db:migrate:deploy"]
                    envFrom:
                      - secretRef:
                          name: database-credentials
          EOF
          
          # Wait for completion
          kubectl wait --for=condition=complete job/db-migrate-${{ github.run_number }} -n ${{ env.NAMESPACE }} --timeout=300s
          
          # Get logs
          kubectl logs job/db-migrate-${{ github.run_number }} -n ${{ env.NAMESPACE }}
          
          # Cleanup
          kubectl delete job db-migrate-${{ github.run_number }} -n ${{ env.NAMESPACE }}

  # ════════════════════════════════════════════════════════════════════════════
  # SUMMARY
  # ════════════════════════════════════════════════════════════════════════════
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy, run-migrations]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Staging |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ needs.deploy.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed By** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployment Status** | ${{ needs.deploy.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Migrations** | ${{ needs.run-migrations.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Staging Environment](https://staging.aivo.ai)" >> $GITHUB_STEP_SUMMARY
          echo "- [Staging API](https://api-staging.aivo.ai)" >> $GITHUB_STEP_SUMMARY
