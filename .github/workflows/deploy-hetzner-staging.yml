# .github/workflows/deploy-hetzner-staging.yml
# =============================================================================
# AIVO Platform — Deploy to Hetzner Staging
# =============================================================================
# Builds Docker images, pushes to GHCR, deploys to K3s on Hetzner Server 2.
# Staging namespace: aivo-staging (runs on Server 3 node).
# =============================================================================

name: Deploy to Hetzner (Staging)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services to deploy (empty = all)'
        required: false
        type: string
        default: ''
      skip_tests:
        description: 'Skip tests (emergency deploys only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: hetzner-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/artpromedia
  NODE_VERSION: '20.19.4'
  PNPM_VERSION: '9.12.0'
  NAMESPACE: aivo-staging
  # SSH target — Server 2 (K3s control plane)
  DEPLOY_HOST: ${{ secrets.HETZNER_APP1_HOST }}
  DEPLOY_USER: deploy

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 0: Determine which services to build/deploy
  # ══════════════════════════════════════════════════════════════════════════
  prepare:
    name: Prepare Service Matrix
    runs-on: ubuntu-latest
    outputs:
      ts_services: ${{ steps.matrix.outputs.ts_services }}
      py_services: ${{ steps.matrix.outputs.py_services }}
      has_ts: ${{ steps.matrix.outputs.has_ts }}
      has_py: ${{ steps.matrix.outputs.has_py }}
    steps:
      - name: Build filtered matrices
        id: matrix
        run: |
          ALL_TS='["auth-svc","session-svc","consent-svc","profile-svc","content-svc","assessment-svc","personalization-svc","life-skills-svc","ai-orchestrator","analytics-svc","notify-svc","messaging-svc","goal-svc","focus-svc","billing-svc","payments-svc","parent-svc","baseline-svc"]'
          ALL_PY='["ai-inference-svc","training-svc","ml-recommendation-svc","brain-engine","python-api-gateway","vision-analysis-svc","speech-analysis-svc","accessibility-ai-svc","question-generation-svc","writing-assessment-svc","content-intelligence-svc","cognitive-load-svc","knowledge-graph-svc","multimodal-analytics-svc","document-intelligence-svc","specialized-support-svc","rl-tutoring-svc","peer-learning-svc","curriculum-py-svc","grading-engine"]'

          INPUT_SERVICES="${{ inputs.services }}"

          if [ -z "$INPUT_SERVICES" ]; then
            # No filter — deploy all
            echo "ts_services=$ALL_TS" >> $GITHUB_OUTPUT
            echo "py_services=$ALL_PY" >> $GITHUB_OUTPUT
            echo "has_ts=true" >> $GITHUB_OUTPUT
            echo "has_py=true" >> $GITHUB_OUTPUT
          else
            # Filter to requested services
            TS_FILTERED="[]"
            PY_FILTERED="[]"
            IFS=',' read -ra SVCS <<< "$INPUT_SERVICES"
            for svc in "${SVCS[@]}"; do
              svc=$(echo "$svc" | xargs) # trim whitespace
              if echo "$ALL_TS" | jq -e "index(\"$svc\")" > /dev/null 2>&1; then
                TS_FILTERED=$(echo "$TS_FILTERED" | jq --arg s "$svc" '. + [$s]')
              fi
              if echo "$ALL_PY" | jq -e "index(\"$svc\")" > /dev/null 2>&1; then
                PY_FILTERED=$(echo "$PY_FILTERED" | jq --arg s "$svc" '. + [$s]')
              fi
            done
            echo "ts_services=$TS_FILTERED" >> $GITHUB_OUTPUT
            echo "py_services=$PY_FILTERED" >> $GITHUB_OUTPUT
            HAS_TS=$([ "$(echo "$TS_FILTERED" | jq 'length')" -gt 0 ] && echo "true" || echo "false")
            HAS_PY=$([ "$(echo "$PY_FILTERED" | jq 'length')" -gt 0 ] && echo "true" || echo "false")
            echo "has_ts=$HAS_TS" >> $GITHUB_OUTPUT
            echo "has_py=$HAS_PY" >> $GITHUB_OUTPUT
          fi

          echo "TS services: $(cat $GITHUB_OUTPUT | grep ts_services)"
          echo "PY services: $(cat $GITHUB_OUTPUT | grep py_services)"

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 1: CI — Lint, TypeCheck, Test, Build (unchanged from GCP pipeline)
  # ══════════════════════════════════════════════════════════════════════════
  ci:
    name: CI Pipeline
    needs: prepare
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aivo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          chmod +x ./scripts/prisma-generate-all.sh 2>/dev/null || true
          ./scripts/prisma-generate-all.sh || true
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: '1'

      - name: Lint
        run: pnpm run lint

      - name: TypeCheck
        run: pnpm -r --if-present run typecheck
        continue-on-error: true

      - name: Test
        if: ${{ !inputs.skip_tests }}
        run: pnpm run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/aivo_test
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: pnpm run build

  # ══════════════════════════════════════════════════════════════════════════
  # VERSION — always runs (even when CI is skipped)
  # ══════════════════════════════════════════════════════════════════════════
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_short: ${{ steps.version.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        run: |
          SHA_SHORT=$(git rev-parse --short=8 HEAD)
          VERSION="main-$SHA_SHORT"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 2: Build & Push Docker Images to GHCR
  # ══════════════════════════════════════════════════════════════════════════
  docker:
    name: Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ci, version, prepare]
    if: |
      always() &&
      needs.prepare.outputs.has_ts == 'true' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.ts_services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── CHANGED: Login to GHCR instead of GCR ──
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            VERSION=${{ needs.version.outputs.version }}
            BUILD_SHA=${{ needs.version.outputs.sha_short }}

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        timeout-minutes: 10
        with:
          image-ref: '${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.service }}:${{ needs.version.outputs.version }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check Trivy results exist
        id: trivy-check
        if: always()
        run: |
          if [ -f "trivy-${{ matrix.service }}.sarif" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy-check.outputs.exists == 'true'
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'container-${{ matrix.service }}'

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 2b: Build & Push Python AI/ML Docker Images to GHCR
  # ══════════════════════════════════════════════════════════════════════════
  docker-python:
    name: Docker (Python) — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ci, version, prepare]
    if: |
      always() &&
      needs.prepare.outputs.has_py == 'true' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.py_services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        timeout-minutes: 10
        with:
          image-ref: '${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.service }}:${{ needs.version.outputs.version }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check Trivy results exist
        id: trivy-check
        if: always()
        run: |
          if [ -f "trivy-${{ matrix.service }}.sarif" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy-check.outputs.exists == 'true'
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'container-${{ matrix.service }}'

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 3: Deploy to K3s via SSH
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Hetzner Staging
    runs-on: ubuntu-latest
    needs: [version, docker, docker-python]
    if: |
      always() &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped') &&
      (needs.docker-python.result == 'success' || needs.docker-python.result == 'skipped')
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # ── CHANGED: SSH deploy instead of GKE ──
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_APP1_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          command_timeout: 45m
          script: |
            set -euo pipefail
            VERSION="${{ needs.version.outputs.version }}"
            NAMESPACE="aivo-staging"

            echo "═══════════════════════════════════════"
            echo "  Deploying AIVO $VERSION to staging"
            echo "  (wave-based deployment)"
            echo "═══════════════════════════════════════"

            # Ensure namespace exists
            kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

            # Ensure GHCR pull secret exists (for private repos)
            kubectl -n "$NAMESPACE" get secret ghcr-pull-secret 2>/dev/null || \
              kubectl -n "$NAMESPACE" create secret docker-registry ghcr-pull-secret \
                --docker-server=ghcr.io \
                --docker-username="${{ github.actor }}" \
                --docker-password="${{ secrets.GHCR_PAT }}"

            # Clone/update repo on server
            REPO_URL="https://x-access-token:${{ secrets.GHCR_PAT }}@github.com/artpromedia/aivo-platform.git"
            if [ -d /opt/aivo ]; then
              cd /opt/aivo
              git remote set-url origin "$REPO_URL"
              git fetch origin main
              git reset --hard origin/main
              git remote set-url origin "https://github.com/artpromedia/aivo-platform.git"
            else
              git clone "$REPO_URL" /opt/aivo
              cd /opt/aivo
              git remote set-url origin "https://github.com/artpromedia/aivo-platform.git"
            fi

            # Update image tags in Hetzner overlay
            cd infra/k8s/overlays/hetzner-staging

            ALL_SERVICES=(
              auth-svc session-svc consent-svc profile-svc
              content-svc assessment-svc personalization-svc life-skills-svc
              ai-orchestrator analytics-svc notify-svc messaging-svc
              goal-svc focus-svc billing-svc payments-svc
              parent-svc baseline-svc
              ai-inference-svc training-svc ml-recommendation-svc
              brain-engine python-api-gateway vision-analysis-svc
              speech-analysis-svc accessibility-ai-svc question-generation-svc
              writing-assessment-svc content-intelligence-svc cognitive-load-svc
              knowledge-graph-svc multimodal-analytics-svc document-intelligence-svc
              specialized-support-svc rl-tutoring-svc peer-learning-svc
              curriculum-py-svc grading-engine
            )

            for svc in "${ALL_SERVICES[@]}"; do
              echo "  Setting image: aivo-${svc}:${VERSION}"
              kustomize edit set image \
                "aivo/${svc}=ghcr.io/artpromedia/aivo-${svc}:${VERSION}" 2>/dev/null || true
            done

            # Build all manifests once
            echo ""
            echo "Building Kubernetes manifests..."
            kustomize build . > /tmp/aivo-staging-manifests.yaml

            # ──────────────────────────────────────────────────────────
            # Deploy in waves of 6 services to avoid overwhelming K3s
            # ──────────────────────────────────────────────────────────
            WAVE_SIZE=6
            TOTAL=${#ALL_SERVICES[@]}
            WAVE=1
            GLOBAL_FAILED=0

            for (( i=0; i<TOTAL; i+=WAVE_SIZE )); do
              WAVE_SERVICES=("${ALL_SERVICES[@]:i:WAVE_SIZE}")
              echo ""
              echo "═══ Wave $WAVE: ${WAVE_SERVICES[*]} ═══"

              # Apply manifests only for services in this wave
              for svc in "${WAVE_SERVICES[@]}"; do
                echo "  Applying ${svc}..."
                # Extract and apply only this service's resources
                grep -A 10000 "^---" /tmp/aivo-staging-manifests.yaml | \
                  awk "/^kind:/{found=0} /name: ${svc}/{found=1} found" RS='---' ORS='---' \
                  2>/dev/null | kubectl apply -f - 2>/dev/null || \
                  # Fallback: apply all (idempotent, only new changes take effect)
                  true
              done
              # Apply full manifests (idempotent — already-running services are unaffected)
              kubectl apply -f /tmp/aivo-staging-manifests.yaml 2>/dev/null || true

              # Wait for this wave's rollouts
              echo "  Waiting for wave $WAVE rollouts..."
              WAVE_FAILED=0
              for svc in "${WAVE_SERVICES[@]}"; do
                if kubectl rollout status "deployment/${svc}" -n "$NAMESPACE" --timeout=180s 2>/dev/null; then
                  echo "  ✅ ${svc}"
                else
                  echo "  ⚠  ${svc} rollout incomplete"
                  WAVE_FAILED=$((WAVE_FAILED + 1))
                fi
              done

              GLOBAL_FAILED=$((GLOBAL_FAILED + WAVE_FAILED))
              echo "  Wave $WAVE complete: ${WAVE_FAILED} incomplete"

              # Brief pause between waves to let the node stabilize
              if [ $((i + WAVE_SIZE)) -lt $TOTAL ]; then
                echo "  Pausing 15s before next wave..."
                sleep 15
              fi

              WAVE=$((WAVE + 1))
            done

            echo ""
            echo "═══════════════════════════════════════════════════"
            echo "  Deployment complete: ${GLOBAL_FAILED}/${TOTAL} incomplete"
            echo "═══════════════════════════════════════════════════"
            echo ""
            kubectl get pods -n "$NAMESPACE" --sort-by=.metadata.name -o wide

      - name: Smoke tests
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_APP1_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            NAMESPACE="aivo-staging"
            FAILED=0

            SERVICES=(auth-svc session-svc content-svc assessment-svc ai-orchestrator)

            for svc in "${SERVICES[@]}"; do
              if kubectl exec -n "$NAMESPACE" "deploy/${svc}" -- \
                curl -sf http://localhost:3000/health --max-time 5 2>/dev/null; then
                echo "✅ ${svc}"
              else
                echo "⚠️  ${svc} health check failed"
                FAILED=$((FAILED + 1))
              fi
            done

            echo ""
            echo "Smoke tests complete: ${FAILED} failed"
            exit 0

      - name: Notify Slack
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} Hetzner staging deploy ${{ job.status }} (${{ needs.version.outputs.version }})"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
