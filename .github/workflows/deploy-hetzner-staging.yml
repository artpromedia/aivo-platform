# .github/workflows/deploy-hetzner-staging.yml
# =============================================================================
# AIVO Platform — Deploy to Hetzner Staging
# =============================================================================
# Builds Docker images, pushes to GHCR, deploys to K3s on Hetzner Server 2.
# Staging namespace: aivo-staging (runs on Server 3 node).
# =============================================================================

name: Deploy to Hetzner (Staging)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services to deploy (empty = all)'
        required: false
        type: string
        default: ''
      skip_tests:
        description: 'Skip tests (emergency deploys only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: hetzner-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/artpromedia
  NODE_VERSION: '20.19.4'
  PNPM_VERSION: '9.12.0'
  NAMESPACE: aivo-staging
  # SSH target — Server 2 (K3s control plane)
  DEPLOY_HOST: ${{ secrets.HETZNER_APP1_HOST }}
  DEPLOY_USER: deploy

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 1: CI — Lint, TypeCheck, Test, Build (unchanged from GCP pipeline)
  # ══════════════════════════════════════════════════════════════════════════
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_short: ${{ steps.version.outputs.sha_short }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aivo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          chmod +x ./scripts/prisma-generate-all.sh 2>/dev/null || true
          ./scripts/prisma-generate-all.sh || true
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: '1'

      - name: Lint
        run: pnpm run lint

      - name: TypeCheck
        run: pnpm -r --if-present run typecheck
        continue-on-error: true

      - name: Test
        if: ${{ !inputs.skip_tests }}
        run: pnpm run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/aivo_test
          REDIS_URL: redis://localhost:6379

      # Build step removed — Docker stage handles per-service builds.
      # The root `pnpm run build` triggers turbo across all ~90 packages
      # (including 10 Next.js web apps) which hangs CI for hours.

      - name: Determine version
        id: version
        run: |
          SHA_SHORT=$(git rev-parse --short=8 HEAD)
          VERSION="main-$SHA_SHORT"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 2: Build & Push Docker Images to GHCR
  # ══════════════════════════════════════════════════════════════════════════
  docker:
    name: Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-svc
          - session-svc
          - consent-svc
          - profile-svc
          - content-svc
          - assessment-svc
          - personalization-svc
          - life-skills-svc
          - ai-orchestrator
          - analytics-svc
          - notify-svc
          - messaging-svc
          - goal-svc
          - focus-svc
          - billing-svc
          - payments-svc
          - parent-svc
          - baseline-svc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── CHANGED: Login to GHCR instead of GCR ──
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.ci.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            VERSION=${{ needs.ci.outputs.version }}
            BUILD_SHA=${{ needs.ci.outputs.sha_short }}

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        timeout-minutes: 10
        with:
          image-ref: '${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.service }}:${{ needs.ci.outputs.version }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check Trivy results exist
        id: trivy-check
        if: always()
        run: |
          if [ -f "trivy-${{ matrix.service }}.sarif" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy-check.outputs.exists == 'true'
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'container-${{ matrix.service }}'

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 2b: Build & Push Python AI/ML Docker Images to GHCR
  # ══════════════════════════════════════════════════════════════════════════
  docker-python:
    name: Docker (Python) — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-inference-svc
          - training-svc
          - ml-recommendation-svc
          - brain-engine
          - python-api-gateway
          - vision-analysis-svc
          - speech-analysis-svc
          - accessibility-ai-svc
          - question-generation-svc
          - writing-assessment-svc
          - content-intelligence-svc
          - cognitive-load-svc
          - knowledge-graph-svc
          - multimodal-analytics-svc
          - document-intelligence-svc
          - specialized-support-svc
          - rl-tutoring-svc
          - peer-learning-svc
          - curriculum-py-svc
          - grading-engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.ci.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        timeout-minutes: 10
        with:
          image-ref: '${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.service }}:${{ needs.ci.outputs.version }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check Trivy results exist
        id: trivy-check
        if: always()
        run: |
          if [ -f "trivy-${{ matrix.service }}.sarif" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy-check.outputs.exists == 'true'
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'container-${{ matrix.service }}'

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 2c: Build & Push Web Frontend Docker Images to GHCR
  # ══════════════════════════════════════════════════════════════════════════
  docker-web:
    name: Docker (Web) — ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        app:
          - web-learner
          - web-teacher
          - web-marketing
          - web-parent
          - web-district
          - web-platform-admin
          - web-author
          - web-creator
          - web-dev-portal
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.ci.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Resolve build args
        id: buildargs
        run: |
          APP="${{ matrix.app }}"
          ARGS="NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.aivolearning.com' }}"
          ARGS="${ARGS}"$'\n'"NEXT_PUBLIC_VERSION=${{ needs.ci.outputs.version }}"

          # App-specific args
          case "$APP" in
            web-learner|web-teacher)
              ARGS="${ARGS}"$'\n'"NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL || 'wss://ws.aivolearning.com' }}"
              ;;
            web-marketing)
              ARGS="${ARGS}"$'\n'"NEXT_PUBLIC_ANALYTICS_ID=${{ secrets.NEXT_PUBLIC_ANALYTICS_ID || '' }}"
              ;;
            web-parent)
              ARGS="${ARGS}"$'\n'"NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || '' }}"
              ;;
          esac

          # Write to output (multiline)
          {
            echo "args<<EOF"
            echo "$ARGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          build-args: ${{ steps.buildargs.outputs.args }}

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        timeout-minutes: 10
        with:
          image-ref: '${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.app }}:${{ needs.ci.outputs.version }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.app }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Check Trivy results exist
        id: trivy-check
        if: always()
        run: |
          if [ -f "trivy-${{ matrix.app }}.sarif" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.trivy-check.outputs.exists == 'true'
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.app }}.sarif'
          category: 'container-${{ matrix.app }}'

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 3: Deploy to K3s (self-hosted runner on Hetzner)
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Hetzner Staging
    runs-on: [self-hosted, hetzner, staging]
    needs: [ci, docker, docker-python, docker-web]
    # Deploy runs if CI passes and at least docker-web succeeds.
    # Backend/Python images already exist on staging from prior deploys.
    if: |
      always() &&
      needs.ci.result == 'success' &&
      needs.docker-web.result == 'success'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Ensure GHCR pull secret
        run: |
          NAMESPACE="aivo-staging"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" get secret ghcr-pull-secret 2>/dev/null || \
            kubectl -n "$NAMESPACE" create secret docker-registry ghcr-pull-secret \
              --docker-server=ghcr.io \
              --docker-username="${{ github.actor }}" \
              --docker-password="${{ secrets.GHCR_PAT }}"

      - name: Ensure web app secrets
        run: |
          NAMESPACE="aivo-staging"
          APPS_WITH_AUTH=(
            web-learner web-teacher web-parent
            web-district web-platform-admin web-author web-creator
          )

          for app in "${APPS_WITH_AUTH[@]}"; do
            SECRET_NAME="${app}-secrets"
            if ! kubectl -n "$NAMESPACE" get secret "$SECRET_NAME" &>/dev/null; then
              NEXTAUTH_SECRET=$(openssl rand -base64 48 | tr -d '\n')
              kubectl -n "$NAMESPACE" create secret generic "$SECRET_NAME" \
                --from-literal="nextauth-secret=${NEXTAUTH_SECRET}"
              echo "✅ Created ${SECRET_NAME}"
            else
              echo "⏭  ${SECRET_NAME} exists"
            fi
          done

      - name: Update image tags
        run: |
          set -euo pipefail
          VERSION="${{ needs.ci.outputs.version }}"

          cd infra/k8s/overlays/hetzner-staging

          # TypeScript services
          TS_SERVICES=(
            auth-svc session-svc consent-svc profile-svc
            content-svc assessment-svc personalization-svc life-skills-svc
            ai-orchestrator analytics-svc notify-svc messaging-svc
            goal-svc focus-svc billing-svc payments-svc
            parent-svc baseline-svc
          )

          # Python AI/ML services
          PY_SERVICES=(
            ai-inference-svc training-svc ml-recommendation-svc
            brain-engine python-api-gateway vision-analysis-svc
            speech-analysis-svc accessibility-ai-svc question-generation-svc
            writing-assessment-svc content-intelligence-svc cognitive-load-svc
            knowledge-graph-svc multimodal-analytics-svc document-intelligence-svc
            specialized-support-svc rl-tutoring-svc peer-learning-svc
            curriculum-py-svc grading-engine
          )

          # Web frontend apps
          WEB_APPS=(
            web-learner web-teacher web-marketing web-parent
            web-district web-platform-admin web-author web-creator
            web-dev-portal
          )

          ALL_SERVICES=("${TS_SERVICES[@]}" "${PY_SERVICES[@]}" "${WEB_APPS[@]}")

          for svc in "${ALL_SERVICES[@]}"; do
            echo "  Setting image: aivo-${svc}:${VERSION}"
            kustomize edit set image \
              "aivo/${svc}=ghcr.io/artpromedia/aivo-${svc}:${VERSION}" 2>/dev/null || true
          done

      - name: Deploy in waves
        run: |
          set -euo pipefail
          VERSION="${{ needs.ci.outputs.version }}"
          NAMESPACE="aivo-staging"

          echo "═══════════════════════════════════════"
          echo "  Deploying AIVO $VERSION to staging"
          echo "═══════════════════════════════════════"

          cd infra/k8s/overlays/hetzner-staging
          kustomize build . > /tmp/aivo-staging-manifests.yaml

          TS_SERVICES=(
            auth-svc session-svc consent-svc profile-svc
            content-svc assessment-svc personalization-svc life-skills-svc
            ai-orchestrator analytics-svc notify-svc messaging-svc
            goal-svc focus-svc billing-svc payments-svc
            parent-svc baseline-svc
          )
          PY_SERVICES=(
            ai-inference-svc training-svc ml-recommendation-svc
            brain-engine python-api-gateway vision-analysis-svc
            speech-analysis-svc accessibility-ai-svc question-generation-svc
            writing-assessment-svc content-intelligence-svc cognitive-load-svc
            knowledge-graph-svc multimodal-analytics-svc document-intelligence-svc
            specialized-support-svc rl-tutoring-svc peer-learning-svc
            curriculum-py-svc grading-engine
          )
          WEB_APPS=(
            web-learner web-teacher web-marketing web-parent
            web-district web-platform-admin web-author web-creator
            web-dev-portal
          )
          ALL_SERVICES=("${TS_SERVICES[@]}" "${PY_SERVICES[@]}" "${WEB_APPS[@]}")

          WAVE_SIZE=6
          TOTAL=${#ALL_SERVICES[@]}
          WAVE=1
          GLOBAL_FAILED=0

          for (( i=0; i<TOTAL; i+=WAVE_SIZE )); do
            WAVE_SERVICES=("${ALL_SERVICES[@]:i:WAVE_SIZE}")
            echo ""
            echo "═══ Wave $WAVE: ${WAVE_SERVICES[*]} ═══"

            kubectl apply -f /tmp/aivo-staging-manifests.yaml 2>/dev/null || true

            echo "  Waiting for wave $WAVE rollouts..."
            WAVE_FAILED=0
            for svc in "${WAVE_SERVICES[@]}"; do
              if kubectl rollout status "deployment/${svc}" -n "$NAMESPACE" --timeout=180s 2>/dev/null; then
                echo "  ✅ ${svc}"
              else
                echo "  ⚠  ${svc} rollout incomplete"
                WAVE_FAILED=$((WAVE_FAILED + 1))
              fi
            done

            GLOBAL_FAILED=$((GLOBAL_FAILED + WAVE_FAILED))
            echo "  Wave $WAVE complete: ${WAVE_FAILED} incomplete"

            if [ $((i + WAVE_SIZE)) -lt $TOTAL ]; then
              echo "  Pausing 15s before next wave..."
              sleep 15
            fi

            WAVE=$((WAVE + 1))
          done

          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  Deployment complete: ${GLOBAL_FAILED}/${TOTAL} incomplete"
          echo "═══════════════════════════════════════════════════"
          echo ""
          kubectl get pods -n "$NAMESPACE" --sort-by=.metadata.name -o wide

      - name: Smoke tests
        run: |
          NAMESPACE="aivo-staging"
          FAILED=0

          # Backend services
          SERVICES=(auth-svc session-svc content-svc assessment-svc ai-orchestrator)

          for svc in "${SERVICES[@]}"; do
            if kubectl exec -n "$NAMESPACE" "deploy/${svc}" -- \
              curl -sf http://localhost:3000/health --max-time 5 2>/dev/null; then
              echo "✅ ${svc}"
            else
              echo "⚠️  ${svc} health check failed"
              FAILED=$((FAILED + 1))
            fi
          done

          # Web frontend apps
          WEB_APPS=(web-learner web-teacher web-marketing web-parent web-platform-admin)

          for app in "${WEB_APPS[@]}"; do
            if kubectl exec -n "$NAMESPACE" "deploy/${app}" -- \
              curl -sf http://localhost:3000/api/health --max-time 5 2>/dev/null; then
              echo "✅ ${app}"
            else
              echo "⚠️  ${app} health check failed"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "Smoke tests complete: ${FAILED} failed"


