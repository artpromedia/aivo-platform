# .github/workflows/deploy-hetzner-staging.yml
# =============================================================================
# AIVO Platform — Deploy to Hetzner Staging
# =============================================================================
# Builds Docker images, pushes to GHCR, deploys to K3s on Hetzner Server 2.
# Staging namespace: aivo-staging (runs on Server 3 node).
# =============================================================================

name: Deploy to Hetzner (Staging)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services to deploy (empty = all)'
        required: false
        type: string
        default: ''
      skip_tests:
        description: 'Skip tests (emergency deploys only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: hetzner-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/artpromedia
  NODE_VERSION: '20.19.4'
  PNPM_VERSION: '9.12.0'
  NAMESPACE: aivo-staging
  # SSH target — Server 2 (K3s control plane)
  DEPLOY_HOST: ${{ secrets.HETZNER_APP1_HOST }}
  DEPLOY_USER: deploy

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 1: CI — Lint, TypeCheck, Test, Build (unchanged from GCP pipeline)
  # ══════════════════════════════════════════════════════════════════════════
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_short: ${{ steps.version.outputs.sha_short }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aivo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          chmod +x ./scripts/prisma-generate-all.sh 2>/dev/null || true
          ./scripts/prisma-generate-all.sh || true
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: '1'

      - name: Lint
        run: pnpm run lint

      - name: TypeCheck
        run: pnpm -r --if-present run typecheck
        continue-on-error: true

      - name: Test
        if: ${{ !inputs.skip_tests }}
        run: pnpm run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/aivo_test
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: pnpm run build

      - name: Determine version
        id: version
        run: |
          SHA_SHORT=$(git rev-parse --short=8 HEAD)
          VERSION="main-$SHA_SHORT"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 2: Build & Push Docker Images to GHCR
  # ══════════════════════════════════════════════════════════════════════════
  docker:
    name: Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-svc
          - session-svc
          - consent-svc
          - profile-svc
          - content-svc
          - assessment-svc
          - personalization-svc
          - life-skills-svc
          - ai-orchestrator
          - analytics-svc
          - notify-svc
          - messaging-svc
          - goal-svc
          - focus-svc
          - billing-svc
          - payments-svc
          - parent-svc
          - baseline-svc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── CHANGED: Login to GHCR instead of GCR ──
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.ci.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            VERSION=${{ needs.ci.outputs.version }}
            BUILD_SHA=${{ needs.ci.outputs.sha_short }}

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        timeout-minutes: 10
        with:
          image-ref: '${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.service }}:${{ needs.ci.outputs.version }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'container-${{ matrix.service }}'

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 2b: Build & Push Python AI/ML Docker Images to GHCR
  # ══════════════════════════════════════════════════════════════════════════
  docker-python:
    name: Docker (Python) — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        service:
          - ai-inference-svc
          - training-svc
          - ml-recommendation-svc
          - brain-engine
          - python-api-gateway
          - vision-analysis-svc
          - speech-analysis-svc
          - accessibility-ai-svc
          - question-generation-svc
          - writing-assessment-svc
          - content-intelligence-svc
          - cognitive-load-svc
          - knowledge-graph-svc
          - multimodal-analytics-svc
          - document-intelligence-svc
          - specialized-support-svc
          - rl-tutoring-svc
          - peer-learning-svc
          - curriculum-py-svc
          - grading-engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.ci.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        timeout-minutes: 10
        with:
          image-ref: '${{ env.IMAGE_PREFIX }}/aivo-${{ matrix.service }}:${{ needs.ci.outputs.version }}'
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'container-${{ matrix.service }}'

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 3: Deploy to K3s via SSH
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Hetzner Staging
    runs-on: ubuntu-latest
    needs: [ci, docker, docker-python]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # ── CHANGED: SSH deploy instead of GKE ──
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_APP1_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -euo pipefail
            VERSION="${{ needs.ci.outputs.version }}"
            NAMESPACE="aivo-staging"

            echo "═══════════════════════════════════════"
            echo "  Deploying AIVO $VERSION to staging"
            echo "═══════════════════════════════════════"

            # Ensure namespace exists
            kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

            # Ensure GHCR pull secret exists (for private repos)
            kubectl -n "$NAMESPACE" get secret ghcr-pull-secret 2>/dev/null || \
              kubectl -n "$NAMESPACE" create secret docker-registry ghcr-pull-secret \
                --docker-server=ghcr.io \
                --docker-username="${{ github.actor }}" \
                --docker-password="${{ secrets.GHCR_PAT }}"

            # Clone/update repo on server (use PAT for private repo)
            REPO_URL="https://x-access-token:${{ secrets.GHCR_PAT }}@github.com/artpromedia/aivo-platform.git"
            if [ -d /opt/aivo ]; then
              cd /opt/aivo
              git remote set-url origin "$REPO_URL"
              git fetch origin main
              git reset --hard origin/main
              # Remove token from stored remote URL
              git remote set-url origin "https://github.com/artpromedia/aivo-platform.git"
            else
              git clone "$REPO_URL" /opt/aivo
              cd /opt/aivo
              git remote set-url origin "https://github.com/artpromedia/aivo-platform.git"
            fi

            # Update image tags in Hetzner overlay
            cd infra/k8s/overlays/hetzner-staging

            # TypeScript services
            TS_SERVICES=(
              auth-svc session-svc consent-svc profile-svc
              content-svc assessment-svc personalization-svc life-skills-svc
              ai-orchestrator analytics-svc notify-svc messaging-svc
              goal-svc focus-svc billing-svc payments-svc
              parent-svc baseline-svc
            )

            # Python AI/ML services
            PY_SERVICES=(
              ai-inference-svc training-svc ml-recommendation-svc
              brain-engine python-api-gateway vision-analysis-svc
              speech-analysis-svc accessibility-ai-svc question-generation-svc
              writing-assessment-svc content-intelligence-svc cognitive-load-svc
              knowledge-graph-svc multimodal-analytics-svc document-intelligence-svc
              specialized-support-svc rl-tutoring-svc peer-learning-svc
              curriculum-py-svc grading-engine
            )

            ALL_SERVICES=("${TS_SERVICES[@]}" "${PY_SERVICES[@]}")

            for svc in "${ALL_SERVICES[@]}"; do
              echo "  Setting image: aivo-${svc}:${VERSION}"
              kustomize edit set image \
                "aivo/${svc}=ghcr.io/artpromedia/aivo-${svc}:${VERSION}" 2>/dev/null || true
            done

            # Apply manifests
            echo ""
            echo "Applying Kubernetes manifests..."
            kustomize build . | kubectl apply -f -

            # Wait for rollouts (parallel with 120s timeout each)
            echo ""
            echo "Waiting for rollouts..."
            PIDS=()
            for svc in "${ALL_SERVICES[@]}"; do
              ( kubectl rollout status "deployment/${svc}" -n "$NAMESPACE" --timeout=120s 2>/dev/null && \
                echo "✅ ${svc}" || echo "⚠ ${svc} rollout incomplete" ) &
              PIDS+=($!)
            done

            # Wait for all background rollout checks
            set +e
            FAILED=0
            for pid in "${PIDS[@]}"; do
              wait "$pid" || FAILED=$((FAILED + 1))
            done
            set -e

            echo ""
            echo "═══ Rollout Summary: ${FAILED} incomplete ═══"
            echo ""
            echo "═══ Pod Status ═══"
            kubectl get pods -n "$NAMESPACE" -o wide

      - name: Smoke tests
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_APP1_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            NAMESPACE="aivo-staging"
            FAILED=0

            SERVICES=(auth-svc session-svc content-svc assessment-svc ai-orchestrator)

            for svc in "${SERVICES[@]}"; do
              if kubectl exec -n "$NAMESPACE" "deploy/${svc}" -- \
                curl -sf http://localhost:3000/health --max-time 5 2>/dev/null; then
                echo "✅ ${svc}"
              else
                echo "⚠️  ${svc} health check failed"
                FAILED=$((FAILED + 1))
              fi
            done

            echo ""
            echo "Smoke tests complete: ${FAILED} failed"
            exit 0

      - name: Notify Slack
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '❌' }} Hetzner staging deploy ${{ job.status }} (${{ needs.ci.outputs.version }})"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
