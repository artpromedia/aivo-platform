name: Coverage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Node.js Services Coverage
  # ═══════════════════════════════════════════════════════════════════════════
  node-coverage:
    name: Node.js Services Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: "pnpm"

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: chmod +x ./scripts/prisma-generate-all.sh && ./scripts/prisma-generate-all.sh
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"

      - name: Run tests with coverage
        run: pnpm run test:coverage
        env:
          CI: true
          NODE_ENV: test

      - name: Upload Node coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info,./services/**/coverage/lcov.info
          flags: node
          name: node-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Check Node coverage thresholds
        run: |
          echo "Checking Node.js service coverage thresholds..."
          node scripts/check-coverage.js

  # ═══════════════════════════════════════════════════════════════════════════
  # Python Services Coverage
  # ═══════════════════════════════════════════════════════════════════════════
  python-coverage:
    name: Python Services Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies and run tests
        run: |
          set -e
          
          # Find all Python services with tests
          for service_dir in services/*/; do
            if [ -f "${service_dir}requirements.txt" ] && [ -d "${service_dir}tests" ]; then
              echo "Testing ${service_dir}..."
              cd "$service_dir"
              
              # Create and activate virtual environment
              python -m venv .venv
              source .venv/bin/activate
              
              # Install dependencies
              pip install --upgrade pip
              pip install -r requirements.txt
              pip install pytest pytest-cov pytest-asyncio
              
              # Run tests with coverage
              python -m pytest tests/ \
                --cov=. \
                --cov-report=xml:coverage.xml \
                --cov-report=term-missing \
                --cov-fail-under=75 \
                || echo "Warning: Coverage below 75% for ${service_dir}"
              
              deactivate
              cd ../..
            fi
          done

      - name: Upload Python coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./services/**/coverage.xml
          flags: python
          name: python-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ═══════════════════════════════════════════════════════════════════════════
  # Coverage Summary
  # ═══════════════════════════════════════════════════════════════════════════
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [node-coverage, python-coverage]
    if: always()
    steps:
      - name: Check coverage results
        run: |
          if [ "${{ needs.node-coverage.result }}" == "failure" ] || \
             [ "${{ needs.python-coverage.result }}" == "failure" ]; then
            echo "❌ Coverage check failed. See job logs for details."
            exit 1
          fi
          echo "✅ All coverage checks passed!"

      - name: Comment on PR with coverage summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const message = `## 📊 Coverage Report
            
            | Component | Status |
            |-----------|--------|
            | Node.js Services | ${{ needs.node-coverage.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Python Services | ${{ needs.python-coverage.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            
            **Thresholds:**
            - Minimum per service: 75%
            - Overall target: 80%
            
            For detailed coverage, see the [Codecov report](https://codecov.io/gh/${{ github.repository }}/pull/${{ github.event.pull_request.number }}).
            `;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
