# =============================================================================
# AIVO Multi-Region Deployment — FUTURE (Not Active)
# =============================================================================
# STATUS: PROVISIONED — DO NOT ENABLE
#
# This workflow deploys to both US-East and US-West Hetzner clusters.
# It is NOT referenced by any trigger and will NOT run until manually
# enabled by changing the workflow_dispatch and push triggers.
#
# The current active production workflow is:
#   .github/workflows/deploy-hetzner-production.yml (single-region)
#
# To activate multi-region:
#   1. Provision infrastructure: cd infra/terraform/multi-region && terraform apply
#   2. Configure K3s clusters in both regions
#   3. Set up PostgreSQL replication (infra/k8s/base/postgres/replication.yaml)
#   4. Deploy NATS gateway (infra/k8s/base/nats/gateway.yaml)
#   5. Update secrets in this workflow
#   6. Rename/swap this workflow with deploy-hetzner-production.yml
# =============================================================================

name: "[FUTURE] Multi-Region Production Deploy"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.2.3)"
        required: true
      target_regions:
        description: "Regions to deploy"
        required: true
        default: "primary-only"
        type: choice
        options:
          - primary-only
          - both-regions
          - secondary-only
      skip_approval:
        description: "Skip approval gate (emergency only)"
        required: false
        type: boolean
        default: false

# Never triggered automatically — manual dispatch only
# When ready to activate, add:
# push:
#   tags: ['v*']

concurrency:
  group: hetzner-production-multiregion
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/owner/aivo
  NAMESPACE: aivo-prod
  PRIMARY_CONTEXT: aivo-us-east
  SECONDARY_CONTEXT: aivo-us-west

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 1: Validate Release
  # ══════════════════════════════════════════════════════════════════════════
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy_primary: ${{ steps.regions.outputs.deploy_primary }}
      deploy_secondary: ${{ steps.regions.outputs.deploy_secondary }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${VERSION}"

      - name: Determine target regions
        id: regions
        run: |
          TARGET="${{ github.event.inputs.target_regions || 'primary-only' }}"
          case "$TARGET" in
            primary-only)
              echo "deploy_primary=true" >> $GITHUB_OUTPUT
              echo "deploy_secondary=false" >> $GITHUB_OUTPUT
              ;;
            both-regions)
              echo "deploy_primary=true" >> $GITHUB_OUTPUT
              echo "deploy_secondary=true" >> $GITHUB_OUTPUT
              ;;
            secondary-only)
              echo "deploy_primary=false" >> $GITHUB_OUTPUT
              echo "deploy_secondary=true" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "Target: ${TARGET}"

      - name: Verify container images exist
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "═══ Verifying images for v${VERSION} ═══"

          TS_SERVICES=(
            aivo-auth-svc aivo-api-gateway aivo-parent-svc aivo-profile-svc
            aivo-content-svc aivo-analytics-svc aivo-billing-svc
            aivo-notification-svc aivo-admin-svc aivo-core-svc
            aivo-assessment-svc aivo-progress-svc aivo-district-svc
            aivo-integration-svc
          )
          PY_SERVICES=(
            aivo-ai-orchestrator aivo-tutoring-engine aivo-assessment-ai
            aivo-content-ai aivo-speech-engine aivo-avatar-engine
            aivo-brain-engine aivo-behavior-ai aivo-nlp-engine
            aivo-recommendation-engine aivo-adaptive-learning
            aivo-curriculum-mapper aivo-gamification-engine
            aivo-knowledge-graph aivo-math-engine
            aivo-parent-insight-engine aivo-reading-engine
            aivo-safety-monitor aivo-special-needs-engine
            aivo-writing-engine
          )
          WEB_APPS=(
            web-learner web-teacher web-marketing web-parent
            web-district web-platform-admin web-author web-creator
            web-dev-portal
          )

          FAILED=0
          for svc in "${TS_SERVICES[@]}" "${PY_SERVICES[@]}" "${WEB_APPS[@]}"; do
            IMG="${{ env.IMAGE_PREFIX }}/${svc}:${VERSION}"
            if docker manifest inspect "$IMG" > /dev/null 2>&1; then
              echo "  ✅ ${svc}"
            else
              echo "  ❌ ${svc} — image not found!"
              FAILED=$((FAILED + 1))
            fi
          done

          if [[ $FAILED -gt 0 ]]; then
            echo "🚨 ${FAILED} images missing!"
            exit 1
          fi
          echo "All 43 images verified."

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 2: Approval Gate
  # ══════════════════════════════════════════════════════════════════════════
  approve:
    name: Approval Gate
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ github.event.inputs.skip_approval != 'true' }}
    environment: production-approval
    steps:
      - name: Approved
        run: echo "Deployment approved by ${{ github.actor }}"

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 3: Deploy to Primary (US-East)
  # ══════════════════════════════════════════════════════════════════════════
  deploy-primary:
    name: Deploy Primary (US-East)
    runs-on: [self-hosted, hetzner, production, us-east]
    needs: [validate, approve]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped') &&
      needs.validate.outputs.deploy_primary == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to US-East cluster
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          NS="${{ env.NAMESPACE }}"
          CTX="${{ env.PRIMARY_CONTEXT }}"

          echo "═══ Deploying v${VERSION} to US-East (Primary) ═══"

          # Apply kustomize manifests
          kubectl --context="$CTX" apply -k infra/k8s/overlays/hetzner -n "$NS"

          # Wave rollout — 6 services at a time
          ALL_SERVICES=(
            auth-svc api-gateway parent-svc profile-svc content-svc
            analytics-svc billing-svc notification-svc admin-svc core-svc
            assessment-svc progress-svc district-svc integration-svc
            ai-orchestrator tutoring-engine assessment-ai content-ai
            speech-engine avatar-engine brain-engine behavior-ai
            nlp-engine recommendation-engine adaptive-learning
            curriculum-mapper gamification-engine knowledge-graph
            math-engine parent-insight-engine reading-engine
            safety-monitor special-needs-engine writing-engine
            web-learner web-teacher web-marketing web-parent
            web-district web-platform-admin web-author web-creator
            web-dev-portal
          )

          WAVE_SIZE=6
          TOTAL=${#ALL_SERVICES[@]}
          for ((i=0; i<TOTAL; i+=WAVE_SIZE)); do
            WAVE=("${ALL_SERVICES[@]:i:WAVE_SIZE}")
            echo ""
            echo "--- Wave $((i/WAVE_SIZE + 1)): ${WAVE[*]} ---"
            for svc in "${WAVE[@]}"; do
              kubectl --context="$CTX" -n "$NS" set image "deploy/${svc}" \
                "${svc}=${{ env.IMAGE_PREFIX }}/aivo-${svc}:${VERSION}" 2>/dev/null || true
            done
            # Wait for wave to stabilize
            for svc in "${WAVE[@]}"; do
              kubectl --context="$CTX" -n "$NS" rollout status "deploy/${svc}" \
                --timeout=120s 2>/dev/null || echo "⚠ ${svc} rollout timeout"
            done
            sleep 20
          done

          echo "✅ US-East deployment complete"

      - name: Smoke test primary
        run: |
          echo "═══ US-East Smoke Tests ═══"
          FAILED=0

          ENDPOINTS=(
            "https://api.aivolearning.com/health"
            "https://app.aivolearning.com"
          )
          for url in "${ENDPOINTS[@]}"; do
            if curl -sf "$url" --max-time 15 -o /dev/null; then
              echo "✅ ${url}"
            else
              echo "❌ ${url}"
              FAILED=$((FAILED + 1))
            fi
          done

          if [[ $FAILED -gt 0 ]]; then
            echo "🚨 Primary smoke tests failed!"
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 4: Verify replication health before secondary deploy
  # ══════════════════════════════════════════════════════════════════════════
  replication-check:
    name: Replication Health Check
    runs-on: [self-hosted, hetzner, production, us-east]
    needs: [validate, deploy-primary]
    if: |
      always() &&
      needs.validate.outputs.deploy_secondary == 'true' &&
      needs.deploy-primary.result == 'success'
    steps:
      - name: Check PostgreSQL replication
        run: |
          echo "═══ PostgreSQL Replication Health ═══"

          # Query replication status from primary
          LAG=$(kubectl --context="${{ env.PRIMARY_CONTEXT }}" exec -n aivo-postgres \
            deploy/postgres-primary -- psql -tAc \
            "SELECT EXTRACT(EPOCH FROM replay_lag) FROM pg_stat_replication WHERE application_name='aivo_standby'" \
            2>/dev/null || echo "unknown")

          echo "Replication lag: ${LAG}s"

          if [[ "$LAG" != "unknown" ]] && (( $(echo "$LAG > 30" | bc -l) )); then
            echo "🚨 Replication lag too high (${LAG}s > 30s). Aborting secondary deploy."
            exit 1
          fi

          echo "✅ Replication healthy"

      - name: Check NATS gateway
        run: |
          echo "═══ NATS Gateway Health ═══"
          kubectl --context="${{ env.PRIMARY_CONTEXT }}" exec -n aivo-nats nats-0 -- \
            nats server report gateways 2>/dev/null || echo "⚠ NATS gateway check skipped"

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 5: Deploy to Secondary (US-West)
  # ══════════════════════════════════════════════════════════════════════════
  deploy-secondary:
    name: Deploy Secondary (US-West)
    runs-on: [self-hosted, hetzner, production, us-west]
    needs: [validate, deploy-primary, replication-check]
    if: |
      always() &&
      needs.validate.outputs.deploy_secondary == 'true' &&
      (needs.replication-check.result == 'success' || needs.replication-check.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to US-West cluster
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          NS="${{ env.NAMESPACE }}"
          CTX="${{ env.SECONDARY_CONTEXT }}"

          echo "═══ Deploying v${VERSION} to US-West (Secondary) ═══"

          # Apply kustomize manifests (same as primary)
          kubectl --context="$CTX" apply -k infra/k8s/overlays/hetzner -n "$NS"

          # Same wave rollout
          ALL_SERVICES=(
            auth-svc api-gateway parent-svc profile-svc content-svc
            analytics-svc billing-svc notification-svc admin-svc core-svc
            assessment-svc progress-svc district-svc integration-svc
            ai-orchestrator tutoring-engine assessment-ai content-ai
            speech-engine avatar-engine brain-engine behavior-ai
            nlp-engine recommendation-engine adaptive-learning
            curriculum-mapper gamification-engine knowledge-graph
            math-engine parent-insight-engine reading-engine
            safety-monitor special-needs-engine writing-engine
            web-learner web-teacher web-marketing web-parent
            web-district web-platform-admin web-author web-creator
            web-dev-portal
          )

          WAVE_SIZE=6
          TOTAL=${#ALL_SERVICES[@]}
          for ((i=0; i<TOTAL; i+=WAVE_SIZE)); do
            WAVE=("${ALL_SERVICES[@]:i:WAVE_SIZE}")
            echo ""
            echo "--- Wave $((i/WAVE_SIZE + 1)): ${WAVE[*]} ---"
            for svc in "${WAVE[@]}"; do
              kubectl --context="$CTX" -n "$NS" set image "deploy/${svc}" \
                "${svc}=${{ env.IMAGE_PREFIX }}/aivo-${svc}:${VERSION}" 2>/dev/null || true
            done
            for svc in "${WAVE[@]}"; do
              kubectl --context="$CTX" -n "$NS" rollout status "deploy/${svc}" \
                --timeout=120s 2>/dev/null || echo "⚠ ${svc} rollout timeout"
            done
            sleep 20
          done

          echo "✅ US-West deployment complete"

      - name: Smoke test secondary
        continue-on-error: true
        run: |
          echo "═══ US-West Smoke Tests ═══"
          # Internal health checks only (secondary doesn't serve public traffic normally)
          kubectl --context="${{ env.SECONDARY_CONTEXT }}" -n "${{ env.NAMESPACE }}" \
            get pods --field-selector=status.phase!=Running -o name | head -5

          READY=$(kubectl --context="${{ env.SECONDARY_CONTEXT }}" -n "${{ env.NAMESPACE }}" \
            get pods -o jsonpath='{range .items[*]}{.status.phase}{"\n"}{end}' | grep -c Running || true)
          TOTAL=$(kubectl --context="${{ env.SECONDARY_CONTEXT }}" -n "${{ env.NAMESPACE }}" \
            get pods --no-headers | wc -l)

          echo "Pods: ${READY}/${TOTAL} running"

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 6: Database Migrations (on primary only)
  # ══════════════════════════════════════════════════════════════════════════
  migrations:
    name: Database Migrations
    runs-on: [self-hosted, hetzner, production, us-east]
    needs: [validate, deploy-primary]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      needs.deploy-primary.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Run Prisma migrations
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          NS="${{ env.NAMESPACE }}"
          CTX="${{ env.PRIMARY_CONTEXT }}"
          RUN_ID="${{ github.run_number }}"

          echo "═══ Running DB Migrations (primary only) ═══"
          echo "Migrations run on US-East primary and replicate to US-West standby."

          cat <<EOF | kubectl --context="$CTX" apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: db-migrate-${RUN_ID}
            namespace: ${NS}
            labels:
              app: db-migrate
              version: ${VERSION}
          spec:
            ttlSecondsAfterFinished: 600
            backoffLimit: 2
            activeDeadlineSeconds: 600
            template:
              metadata:
                labels:
                  app: db-migrate
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${{ env.IMAGE_PREFIX }}/aivo-auth-svc:${VERSION}
                    workingDir: /app
                    command: ["sh", "-c", "DATABASE_URL=\${DATABASE_URL/:6432/:5432} npx --yes prisma@5.22.0 migrate deploy --schema ./prisma/schema.prisma"]
                    envFrom:
                      - secretRef:
                          name: shared-secrets
                      - secretRef:
                          name: auth-svc-secrets
                    resources:
                      requests:
                        memory: "256Mi"
                        cpu: "100m"
                      limits:
                        memory: "512Mi"
                        cpu: "500m"
                imagePullSecrets:
                  - name: ghcr-pull-secret
          EOF

          if kubectl --context="$CTX" wait --for=condition=complete \
            "job/db-migrate-${RUN_ID}" -n "$NS" --timeout=600s; then
            echo "✅ Migrations complete (will replicate to standby)"
          else
            echo "❌ Migration failed"
            kubectl --context="$CTX" logs "job/db-migrate-${RUN_ID}" -n "$NS"
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════════════════
  # STAGE 7: Deployment Record
  # ══════════════════════════════════════════════════════════════════════════
  record:
    name: Deployment Record
    runs-on: ubuntu-latest
    needs: [validate, deploy-primary, deploy-secondary, migrations]
    if: always() && needs.validate.result == 'success'
    steps:
      - name: Create GitHub deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production-multiregion
          ref: ${{ needs.validate.outputs.version }}
          description: |
            Multi-region deployment of v${{ needs.validate.outputs.version }}
            Primary (US-East): ${{ needs.deploy-primary.result }}
            Secondary (US-West): ${{ needs.deploy-secondary.result }}
            Migrations: ${{ needs.migrations.result }}

      - name: Summary
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          echo "# 🚀 Multi-Region Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`v${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Primary (US-East)** | ${{ needs.deploy-primary.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Secondary (US-West)** | ${{ needs.deploy-secondary.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Migrations** | ${{ needs.migrations.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u +'%Y-%m-%dT%H:%M:%SZ') |" >> $GITHUB_STEP_SUMMARY
