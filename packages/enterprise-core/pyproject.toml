[project]
name = "aivo-enterprise-core"
version = "1.0.0"
description = "Enterprise-grade shared models for AIVO Platform - compliance, governance, and ML models"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "AIVO Platform Team" }
]
keywords = [
    "enterprise",
    "compliance",
    "gdpr",
    "coppa",
    "ferpa",
    "audit",
    "knowledge-tracing",
    "adaptive-learning"
]

dependencies = [
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enterprise_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
