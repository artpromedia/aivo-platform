# Flags for different test types
flags:
  node:
    paths:
      - services/**/src/**
      - libs/**/src/**
    carryforward: true
  
  python:
    paths:
      - services/**/*.py
    carryforward: true
  
  integration:
    paths:
      - tests/integration/**
    carryforward: true

# PR comment configuration
comment:
  layout: "header, diff, components, flags, files"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true
  hide_project_coverage: false
  # Show coverage change direction with ▲/▼ indicators
  show_carryforward_flags: true

# Ignore patterns
ignore:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/test/**"
  - "**/tests/**"
  - "**/__tests__/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.next/**"
  - "**/coverage/**"
  - "**/scripts/**"
  - "**/docs/**"
  - "**/*.config.ts"
  - "**/*.config.js"
  - "**/vitest.config.ts"
  - "**/prisma/**"
  - "**/generated/**"

# GitHub Actions integration
github_checks:
  annotations: true

# Notify configuration
notify:
  # Wait for all CI jobs to complete before posting
  wait_for_ci: true
