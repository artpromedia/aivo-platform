# Codecov Configuration
# https://docs.codecov.com/docs/codecov-yaml
#
# This configuration enforces coverage thresholds for the AIVO monorepo.
# Sprint 8: Targets raised to 95% project / 90% patch for gate enforcement.

coverage:
  # Overall coverage targets
  status:
    project:
      default:
        target: 95%
        threshold: 2%
        if_not_found: success
        informational: false

      # Critical services — must not regress below 90%
      critical-services:
        target: 90%
        threshold: 1%
        informational: false
        paths:
          - services/auth-svc/**
          - services/billing-svc/**
          - services/payments-svc/**
          - services/ai-orchestrator/**
          - services/assessment-svc/**
          - services/tenant-svc/**
          - services/notify-svc/**
          - services/content-svc/**
          - services/lti-svc/**
          - services/analytics-svc/**

    # Per-flag targets
    patch:
      default:
        target: 90%
        threshold: 5%
        if_not_found: success
        informational: false

  # Precision for coverage display
  precision: 2
  round: down
  range: "70...100"

