<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3B82F6">
  <title>Offline - AIVO Learning</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      padding: 48px;
      max-width: 480px;
      text-align: center;
    }

    .icon {
      width: 120px;
      height: 120px;
      background: #FEF3C7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 48px;
    }

    h1 {
      color: #1E293B;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    p {
      color: #64748B;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .tips {
      background: #F8FAFC;
      border-radius: 16px;
      padding: 24px;
      text-align: left;
      margin-bottom: 32px;
    }

    .tips h3 {
      color: #1E293B;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .tips ul {
      list-style: none;
      padding: 0;
    }

    .tips li {
      color: #475569;
      font-size: 14px;
      padding: 8px 0;
      display: flex;
      align-items: center;
    }

    .tips li::before {
      content: "✓";
      color: #10B981;
      font-weight: bold;
      margin-right: 12px;
    }

    .button {
      display: inline-block;
      background: #3B82F6;
      color: white;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .button:hover {
      background: #2563EB;
    }

    .status {
      margin-top: 24px;
      padding: 12px 20px;
      background: #FEF2F2;
      border-radius: 8px;
      color: #991B1B;
      font-size: 14px;
      display: none;
    }

    .status.online {
      background: #ECFDF5;
      color: #065F46;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <span id="status-icon">📶</span>
    </div>

    <h1>You're Offline</h1>
    <p>
      Don't worry! Your learning progress is saved locally and will sync
      when you're back online.
    </p>

    <div class="tips">
      <h3>While offline, you can still:</h3>
      <ul>
        <li>View downloaded lessons</li>
        <li>Practice with cached exercises</li>
        <li>Review your notes</li>
        <li>Complete saved quizzes</li>
      </ul>
    </div>

    <button class="button" onclick="tryAgain()">Try Again</button>

    <div class="status" id="status"></div>
  </div>

  <script>
    // Check online status
    function updateStatus() {
      const statusEl = document.getElementById('status');
      const iconEl = document.getElementById('status-icon');

      if (navigator.onLine) {
        statusEl.textContent = 'You\'re back online! Redirecting...';
        statusEl.className = 'status online';
        statusEl.style.display = 'block';
        iconEl.textContent = '✅';

        // Redirect after a brief delay
        setTimeout(() => {
          window.location.reload();
        }, 1500);
      } else {
        statusEl.textContent = 'Still offline. Check your internet connection.';
        statusEl.className = 'status';
        statusEl.style.display = 'block';
        iconEl.textContent = '📶';
      }
    }

    // Listen for online/offline events
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);

    // Manual retry
    function tryAgain() {
      updateStatus();
      if (navigator.onLine) {
        window.location.reload();
      }
    }

    // Periodic check
    setInterval(() => {
      if (navigator.onLine) {
        updateStatus();
      }
    }, 5000);
  </script>
</body>
</html>
