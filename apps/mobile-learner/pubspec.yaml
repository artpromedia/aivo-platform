name: mobile_learner
version: 1.0.0
publish_to: "none"
description: Flutter app for learners.
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  provider: ^6.1.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  jwt_decode: ^0.3.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  audioplayers: ^6.0.0
  video_player: ^2.9.1
  flutter_tts: ^4.0.2
  flutter_svg: ^2.0.10+1
  speech_to_text: ^7.0.0
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  firebase_crashlytics: ^3.5.7
  firebase_analytics: ^10.10.7
  sqflite: ^2.3.3+2
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  app_links: ^6.3.3
  image_picker: ^1.0.7
  flutter_common:
    path: ../../libs/flutter-common
  flutter_notifications:
    path: ../../libs/flutter-notifications

dependency_overrides:
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

# Configure app launcher icons  
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false  # Not configured yet
  image_path: "assets/icons/aivo-appicon-scholar.png"
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/icons/aivo-icon-purple.png"
  monochrome_icon: false
  
# Configure splash screen
flutter_native_splash:
  color: "#7C3AED"  # AIVO brand purple
  image: "assets/splash/splash_logo_white.png"
  android: true
  ios: false  # Not configured yet
  web: false
  android_12:
    color: "#7C3AED"  # AIVO brand purple
    image: "assets/splash/splash_logo_white.png"
