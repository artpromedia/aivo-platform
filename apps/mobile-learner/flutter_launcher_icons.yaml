# Flutter Launcher Icons configuration
# Run: flutter pub run flutter_launcher_icons
# https://pub.dev/packages/flutter_launcher_icons

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/aivo-appicon-scholar.png"
  min_sdk_android: 21

  # Adaptive icon configuration (Android 8.0+)
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/icons/aivo-icon-purple.png"
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"

  # Android specific
  android_icon_path: "android/app/src/main/res/mipmap-"

  # iOS specific
  remove_alpha_ios: true

  # Web favicon
  web:
    generate: false
    image_path: "assets/icons/aivo-appicon-scholar.png"
    background_color: "#7C3AED"
    theme_color: "#7C3AED"

  # Windows specific
  windows:
    generate: false

  # macOS specific
  macos:
    generate: false

# Flavor-specific icons
# Uncomment and configure for different flavors
