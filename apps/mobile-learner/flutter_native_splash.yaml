# Flutter Native Splash configuration
# Run: flutter pub run flutter_native_splash:create
# https://pub.dev/packages/flutter_native_splash

flutter_native_splash:
  # Logo image to display on splash screen
  image: assets/splash/splash_logo.png

  # Background color (White background as per design)
  color: "#FFFFFF"

  # Android 12+ settings
  android_12:
    image: assets/splash/splash_logo.png
    icon_background_color: "#FFFFFF"

  # Android settings
  android: true
  android_gravity: center
  android_screen_orientation: portrait
  fullscreen: true

  # iOS settings
  ios: false

  # Web settings
  web: false
