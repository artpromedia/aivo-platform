#cloud-config
# =============================================================================
# AIVO ML Node — Cloud-Init (K3s Agent for Python AI/ML services)
# =============================================================================

package_update: true
package_upgrade: true

packages:
  - ufw
  - fail2ban
  - unattended-upgrades
  - curl
  - ca-certificates
  - python3
  - python3-pip
  - python3-venv

runcmd:
  # --- Install K3s Agent ---
  - |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="${k3s_version}" sh -s - agent \
      --token "${k3s_token}" \
      --server "${k3s_server}" \
      --flannel-iface ens10 \
      --node-label "role=ml" \
      --node-label "workload-type=ai-ml" \
      --node-taint "workload-type=ai-ml:NoSchedule"

  # --- Setup directories ---
  - mkdir -p /opt/aivo/models
  - mkdir -p /opt/aivo/model-cache
  - mkdir -p /var/log/aivo

  # --- Firewall ---
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow from 10.0.0.0/24 to any port 10250
  - ufw allow from 10.0.0.0/24 to any port 8472 proto udp
  - ufw --force enable

  # --- Fail2ban ---
  - systemctl enable fail2ban
  - systemctl start fail2ban
