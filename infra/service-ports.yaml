# =============================================================================
# AIVO Platform - Centralized Service Port Configuration
# =============================================================================
# This file is the single source of truth for service port assignments.
# It is referenced by:
#   - docker/Dockerfile.service (via SERVICE_PORT build arg)
#   - .github/workflows/ci-unified.yml (matrix port values)
#   - Kubernetes deployment manifests (containerPort, probes)
#   - Smoke test / health check scripts
#
# When adding a new service or changing a port, update this file AND
# the corresponding entries in ci-unified.yml and K8s manifests.
# =============================================================================

