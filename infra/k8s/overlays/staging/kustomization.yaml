# =============================================================================
# AIVO Platform - Staging Environment Overlay
# =============================================================================
# Staging-specific configuration that overrides base settings.
# Deployed via GitHub Actions workflow: deploy-staging.yml
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference the base configuration
# NOTE (2026-02-05): CI deploys only ai-orchestrator directly (see ci-unified.yml).
# Keep overlay intact for full staging restore later.
resources:
  - ../../base

# Override namespace for staging
namespace: aivo-staging

# Staging-specific labels
commonLabels:
  environment: staging

# Common annotations
commonAnnotations:
  deployment.kubernetes.io/environment: staging

# Image configuration - use GCR registry
# Note: Image tags are set dynamically by the CI/CD pipeline using:
#   kustomize edit set image gcr.io/aivo-learning/<service>=gcr.io/aivo-learning/<service>:<tag>
images:
  # Authentication & User Management
  - name: aivo/auth-svc
    newName: gcr.io/aivo-learning/auth-svc
  - name: aivo/session-svc
    newName: gcr.io/aivo-learning/session-svc
  - name: aivo/consent-svc
    newName: gcr.io/aivo-learning/consent-svc
  - name: aivo/profile-svc
    newName: gcr.io/aivo-learning/profile-svc
  # Content & Learning
  - name: aivo/content-svc
    newName: gcr.io/aivo-learning/content-svc
  - name: aivo/assessment-svc
    newName: gcr.io/aivo-learning/assessment-svc
  - name: aivo/personalization-svc
    newName: gcr.io/aivo-learning/personalization-svc
  - name: aivo/life-skills-svc
    newName: gcr.io/aivo-learning/life-skills-svc
  # AI & Analytics
  - name: aivo/ai-orchestrator
    newName: gcr.io/aivo-learning/ai-orchestrator
  - name: aivo/analytics-svc
    newName: gcr.io/aivo-learning/analytics-svc
  # Communication
  - name: aivo/notify-svc
    newName: gcr.io/aivo-learning/notify-svc
  - name: aivo/messaging-svc
    newName: gcr.io/aivo-learning/messaging-svc
  # Goal & Focus
  - name: aivo/goal-svc
    newName: gcr.io/aivo-learning/goal-svc
  - name: aivo/focus-svc
    newName: gcr.io/aivo-learning/focus-svc
  # Billing & Payments
  - name: aivo/billing-svc
    newName: gcr.io/aivo-learning/billing-svc
  - name: aivo/payments-svc
    newName: gcr.io/aivo-learning/payments-svc
  # Parent Portal
  - name: aivo/parent-svc
    newName: gcr.io/aivo-learning/parent-svc
  - name: aivo/baseline-svc
    newName: gcr.io/aivo-learning/baseline-svc

# Patches for staging-specific configuration
patches:
  # Keep NODE_ENV=production for staging (required for prod dependency resolution)
  # Use APP_ENV to distinguish staging from production
  - target:
      kind: ConfigMap
    patch: |-
      - op: replace
        path: /data/NODE_ENV
        value: "production"

  # Reduce replicas for staging (cost optimization)
  - target:
      kind: Deployment
      name: auth-svc
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: content-svc
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: session-svc
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: ai-orchestrator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # TEMP (2026-02-05): Lower ai-orchestrator resources for staging capacity.
  # Revert by removing this patch block to restore base requests/limits.
  - target:
      kind: Deployment
      name: ai-orchestrator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"

  # Reduce HPA max replicas for staging
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 5

  # Allow ai-orchestrator to reach Memorystore Redis (staging)
  - target:
      kind: NetworkPolicy
      name: ai-orchestrator-network-policy
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: 10.234.111.187/32
          ports:
            - protocol: TCP
              port: 6379

  # Reduce resource requests for all services in staging to fit in smaller cluster
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "50m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "128Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
