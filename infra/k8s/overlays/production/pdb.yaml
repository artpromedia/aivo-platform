# =============================================================================
# AIVO Platform - Pod Disruption Budgets (Production)
# =============================================================================
# Ensures high availability during node maintenance and deployments
# =============================================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-svc-pdb
  namespace: aivo-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-svc

