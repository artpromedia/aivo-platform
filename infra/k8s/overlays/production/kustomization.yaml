# =============================================================================
# AIVO Platform - Production Environment Overlay
# =============================================================================
# Production-specific configuration that overrides base settings.
# Deployed via GitHub Actions CI/CD pipeline to Hetzner
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference the base configuration
resources:
  - ../../base
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policies.yaml

# Override namespace for production
namespace: aivo-prod

# Production-specific labels
commonLabels:
  environment: production
  app.kubernetes.io/environment: production

# Common annotations
commonAnnotations:
  deployment.kubernetes.io/environment: production
  prometheus.io/scrape: "true"

# Image configuration - use GitHub Container Registry (GHCR)
# Note: Image tags are set dynamically by the CI/CD pipeline using:
#   kustomize edit set image ghcr.io/artpromedia/aivo-<service>=ghcr.io/artpromedia/aivo-<service>:<tag>
images:
  - name: aivo/auth-svc
    newName: ghcr.io/artpromedia/aivo-auth-svc
  - name: aivo/content-svc
    newName: ghcr.io/artpromedia/aivo-content-svc
  - name: aivo/session-svc
    newName: ghcr.io/artpromedia/aivo-session-svc
  - name: aivo/assessment-svc
    newName: ghcr.io/artpromedia/aivo-assessment-svc
  - name: aivo/analytics-svc
    newName: ghcr.io/artpromedia/aivo-analytics-svc
  - name: aivo/ai-orchestrator
    newName: ghcr.io/artpromedia/aivo-ai-orchestrator
  - name: aivo/notify-svc
    newName: ghcr.io/artpromedia/aivo-notify-svc
  - name: aivo/messaging-svc
    newName: ghcr.io/artpromedia/aivo-messaging-svc
  - name: aivo/goal-svc
    newName: ghcr.io/artpromedia/aivo-goal-svc
  - name: aivo/focus-svc
    newName: ghcr.io/artpromedia/aivo-focus-svc
  - name: aivo/personalization-svc
    newName: ghcr.io/artpromedia/aivo-personalization-svc
  - name: aivo/billing-svc
    newName: ghcr.io/artpromedia/aivo-billing-svc
  - name: aivo/consent-svc
    newName: ghcr.io/artpromedia/aivo-consent-svc
  - name: aivo/profile-svc
    newName: ghcr.io/artpromedia/aivo-profile-svc
  - name: aivo/baseline-svc
    newName: ghcr.io/artpromedia/aivo-baseline-svc
  - name: aivo/life-skills-svc
    newName: ghcr.io/artpromedia/aivo-life-skills-svc
  - name: aivo/parent-svc
    newName: ghcr.io/artpromedia/aivo-parent-svc
  - name: aivo/payments-svc
    newName: ghcr.io/artpromedia/aivo-payments-svc

# Patches for production-specific configurations
patches:
  # Increase replica counts for production
  - target:
      kind: Deployment
      name: auth-svc
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: content-svc
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: session-svc
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: ai-orchestrator
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: analytics-svc
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: billing-svc
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

# ConfigMap generators for production environment
configMapGenerator:
  - name: production-config
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - ENABLE_METRICS=true
      - ENABLE_TRACING=true

# Secret generator references (actual secrets from K8s Secrets)
secretGenerator:
  - name: production-secrets
    type: Opaque
    options:
      disableNameSuffixHash: true
    # Secrets are mounted from external-secrets operator
