# ============================================================================
# Web Parent — Kubernetes Deployment
# ============================================================================
# Next.js standalone app — the parent/caregiver dashboard.
# ============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-parent-config
  namespace: aivo
  labels:
    app.kubernetes.io/name: web-parent
    app.kubernetes.io/component: frontend
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  NEXT_TELEMETRY_DISABLED: "1"
  # ── Server-side service URLs (required for login & API rewrites) ──
  AUTH_SVC_URL: "http://auth-svc:3000"
  PARENT_SVC_URL: "http://parent-svc:3000"
  BILLING_SVC_URL: "http://billing-svc:3000"
  GAMIFICATION_SVC_URL: "http://gamification-svc:3000"
  NEXT_PUBLIC_API_URL: "http://api-gateway:3000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-parent
  namespace: aivo
  labels:
    app.kubernetes.io/name: web-parent
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: aivo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-parent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-parent
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      containers:
        - name: web-parent
          image: aivo/web-parent:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: web-parent-config

          env:
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-parent-secrets
                  key: nextauth-secret
            - name: AUTH_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-svc-secrets
                  key: jwt-public-key
            - name: NEXTAUTH_URL
              value: "https://parent.aivolearning.com"

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /app/apps/web-parent/.next/cache

      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: web-parent
  namespace: aivo
  labels:
    app.kubernetes.io/name: web-parent
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: web-parent
