# ============================================================================
# Web Teacher — Kubernetes Deployment
# ============================================================================
# Next.js standalone app — the teacher dashboard and class management.
# ============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-teacher-config
  namespace: aivo
  labels:
    app.kubernetes.io/name: web-teacher
    app.kubernetes.io/component: frontend
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  NEXT_TELEMETRY_DISABLED: "1"
  # ── Server-side service URLs (required — code throws in production if missing) ──
  AUTH_SVC_URL: "http://auth-svc:3000"
  IEP_SVC_URL: "http://iep-svc:3000"
  # Server-side BFF URLs checked by getServiceUrl() at module eval
  NEXT_PUBLIC_MARKETPLACE_API_URL: "http://api-gateway:3000/api/v1"
  NEXT_PUBLIC_ANALYTICS_URL: "http://analytics-svc:3000"
  NEXT_PUBLIC_GRADEBOOK_SVC_URL: "http://api-gateway:3000/api/v1"
  NEXT_PUBLIC_COMMUNITY_SVC_URL: "http://api-gateway:3000/api/v1"
  NEXT_PUBLIC_CONTENT_SVC_URL: "http://content-svc:3000"
  NEXT_PUBLIC_REALTIME_URL: "http://realtime-svc:3000"
  NEXT_PUBLIC_MESSAGING_SVC_URL: "http://messaging-svc:3000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-teacher
  namespace: aivo
  labels:
    app.kubernetes.io/name: web-teacher
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: aivo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web-teacher
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-teacher
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      containers:
        - name: web-teacher
          image: aivo/web-teacher:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: web-teacher-config

          env:
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-teacher-secrets
                  key: nextauth-secret
            - name: NEXTAUTH_URL
              value: "https://teacher.aivolearning.com"

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /app/apps/web-teacher/.next/cache

      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: web-teacher
  namespace: aivo
  labels:
    app.kubernetes.io/name: web-teacher
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: web-teacher
