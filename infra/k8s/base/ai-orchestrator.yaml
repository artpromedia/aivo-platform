# ============================================================================
# AIVO Microservice Kubernetes Deployment Template
# ============================================================================
#
# Copy this template and replace the following placeholders:
#   - ai-orchestrator: The name of your service (e.g., auth-svc, billing-svc)
#   - 3000: The port your service listens on (usually 3000)
#   - 500m: CPU request (e.g., 100m, 250m)
#   - 2000m: CPU limit (e.g., 500m, 1000m)
#   - 1Gi: Memory request (e.g., 256Mi, 512Mi)
#   - 4Gi: Memory limit (e.g., 512Mi, 1Gi)
#   - 2: Minimum number of replicas (e.g., 2)
#   - 8: Maximum number of replicas (e.g., 10)
#
# Resource Sizing Guidelines:
#   Auth/Core:          CPU 100m/500m,   Mem 256Mi/512Mi
#   API Gateway:        CPU 200m/1000m,  Mem 512Mi/1Gi
#   AI/ML Services:     CPU 500m/2000m,  Mem 1Gi/4Gi
#   Background Workers: CPU 100m/500m,   Mem 256Mi/512Mi
#   Realtime/WebSocket: CPU 200m/1000m,  Mem 512Mi/1Gi
#
# ============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-orchestrator-config
  namespace: aivo
  labels:
    app.kubernetes.io/name: ai-orchestrator
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  HOST: "0.0.0.0"
  # LLM Provider Configuration (Production)
  # Google Gemini is primary, OpenAI and Anthropic are fallbacks
  LLM_PRIMARY_PROVIDER: "google"
  LLM_FALLBACK_ORDER: "google,openai,anthropic"
  # Google Gemini settings
  GOOGLE_LOCATION: "us-central1"
  GOOGLE_RATE_LIMIT_TPM: "100000"
  GOOGLE_RATE_LIMIT_RPM: "500"
  # OpenAI settings
  OPENAI_RATE_LIMIT_TPM: "150000"
  OPENAI_RATE_LIMIT_RPM: "500"
  # Anthropic settings
  ANTHROPIC_RATE_LIMIT_TPM: "100000"
  ANTHROPIC_RATE_LIMIT_RPM: "500"
  # LLM Cache settings
  LLM_CACHE_ENABLED: "true"
  LLM_CACHE_TTL_SECONDS: "3600"
  # Safety settings
  SAFETY_STRICT_MODE: "true"
  SAFETY_LOG_BLOCKED_CONTENT: "true"
  # Development mode MUST be false in production
  IS_DEVELOPMENT: "false"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestrator
  namespace: aivo
  labels:
    app.kubernetes.io/name: ai-orchestrator
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: aivo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-orchestrator
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ai-orchestrator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      # Optional: Add init containers for migrations
      # initContainers:
      #   - name: migrations
      #     image: aivo/ai-orchestrator:latest
      #     command: ["npm", "run", "db:migrate"]
      #     env:
      #       - name: DATABASE_URL
      #         valueFrom:
      #           secretKeyRef:
      #             name: ai-orchestrator-secrets
      #             key: database-url

      containers:
        - name: ai-orchestrator
          image: aivo/ai-orchestrator:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          envFrom:
            - configMapRef:
                name: ai-orchestrator-config

          env:
            # Database (if applicable)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-orchestrator-secrets
                  key: database-url
                  optional: true

            # Shared infrastructure secrets
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: shared-secrets
                  key: redis-url
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: shared-secrets
                  key: nats-url

            # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
            # LLM Provider API Keys (from GCP Secret Manager)
            # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

            # Google Gemini (PRIMARY)
            - name: GOOGLE_GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-provider-secrets
                  key: google-gemini-api-key
            - name: GOOGLE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: llm-provider-secrets
                  key: google-project-id

            # OpenAI (FALLBACK 1)
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-provider-secrets
                  key: openai-api-key
            - name: OPENAI_ORGANIZATION_ID
              valueFrom:
                secretKeyRef:
                  name: llm-provider-secrets
                  key: openai-organization-id
                  optional: true

            # Anthropic (FALLBACK 2)
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-provider-secrets
                  key: anthropic-api-key

            # LLM Cache Redis URL
            - name: LLM_CACHE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: shared-secrets
                  key: redis-url

            # Internal API Key for service-to-service auth
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-orchestrator-secrets
                  key: internal-api-key

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
              ephemeral-storage: "512Mi"

          # Liveness probe: Is the application alive?
          # Fails = restart the container
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe: Is the application ready to receive traffic?
          # Fails = remove from service endpoints
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Startup probe: Has the application started successfully?
          # Prevents liveness probe from killing slow-starting containers
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.cache

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

      # Spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ai-orchestrator
                topologyKey: kubernetes.io/hostname

      # Spread pods across availability zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ai-orchestrator

---
apiVersion: v1
kind: Service
metadata:
  name: ai-orchestrator
  namespace: aivo
  labels:
    app.kubernetes.io/name: ai-orchestrator
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: ai-orchestrator

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-orchestrator
  namespace: aivo
  labels:
    app.kubernetes.io/name: ai-orchestrator

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-orchestrator
  namespace: aivo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-orchestrator
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-orchestrator
  namespace: aivo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-orchestrator

---
# Network Policy: Restrict ingress to only gateway and other aivo services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-orchestrator-network-policy
  namespace: aivo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-orchestrator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from gateway namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: aivo-gateway
      ports:
        - protocol: TCP
          port: 3000
    # Allow from other aivo services
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3000
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow to other aivo services
    - to:
        - podSelector: {}
    # Allow to infrastructure (Redis, NATS, Postgres)
    - to:
        - namespaceSelector:
            matchLabels:
              name: aivo-infra
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
