# PodDisruptionBudgets — ensure minimum availability during node drains
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-svc-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-svc
---
