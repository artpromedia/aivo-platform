##
## Auth Service Secrets — Kubernetes Secret Manifest
##
## Values are placeholders.  Real values are injected by the CI/CD pipeline
## or sealed-secrets controller.  NEVER commit actual credentials here.
##
## Mounted into the auth-svc pod via `envFrom.secretRef` in the deployment.
##
apiVersion: v1
kind: Secret
metadata:
  name: auth-svc-secrets
  namespace: aivo-prod
  labels:
    app.kubernetes.io/name: auth-svc
    app.kubernetes.io/part-of: aivo-platform
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  ## Path inside the pod where JWT key files are mounted (see jwt-keys-secret.yaml)
  JWT_PRIVATE_KEY_PATH: "/secrets/jwt/private.pem"
  JWT_PUBLIC_KEY_PATH: "/secrets/jwt/public.pem"

  ## Cookie signing secret — REPLACE with a 64-char random hex string in CI
  COOKIE_SECRET: "REPLACE_IN_CI"

  ## Internal service-to-service API key
  INTERNAL_API_KEY: "REPLACE_IN_CI"

  ## PostgreSQL connection string
  DATABASE_URL: "REPLACE_IN_CI"

  ## SSO state encryption key (32+ chars)
  SSO_STATE_ENCRYPTION_KEY: "REPLACE_IN_CI"

  ## MFA TOTP secret encryption key
  MFA_ENCRYPTION_KEY: "REPLACE_IN_CI"

  ## Redis URL for session storage and key rotation
  REDIS_URL: "REPLACE_IN_CI"
