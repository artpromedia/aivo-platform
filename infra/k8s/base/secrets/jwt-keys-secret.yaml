##
## JWT Signing Keys — Kubernetes Secret Manifest
##
## Contains the RSA-2048 key pair used by auth-svc to sign and verify JWTs.
## The data values below are BASE64-encoded PEM files.
##
## In CI/CD, replace the placeholder data with:
##   openssl genrsa 2048 | base64 -w0          → private.pem
##   openssl rsa -pubout | base64 -w0           → public.pem
##
## Mounted into the auth-svc pod at /secrets/jwt/ as a read-only volume.
##
apiVersion: v1
kind: Secret
metadata:
  name: jwt-keys
  namespace: aivo-prod
  labels:
    app.kubernetes.io/name: auth-svc
    app.kubernetes.io/part-of: aivo-platform
    app.kubernetes.io/component: jwt-keys
type: Opaque
data:
  ## Base64-encoded RSA private key PEM — REPLACE in CI pipeline
  private.pem: "REPLACE_WITH_BASE64_ENCODED_PRIVATE_KEY_PEM"
  ## Base64-encoded RSA public key PEM — REPLACE in CI pipeline
  public.pem: "REPLACE_WITH_BASE64_ENCODED_PUBLIC_KEY_PEM"
