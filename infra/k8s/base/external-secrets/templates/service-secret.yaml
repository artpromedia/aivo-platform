# Template — one ExternalSecret per service
# Generated by scripts/generate-external-secrets.sh
#
# Variables:
#   {{ service_name }}  — e.g. auth-svc
#   {{ namespace }}     — e.g. aivo-staging, aivo-prod
#   {{ db_key }}        — Vault property for DATABASE_URL (e.g. auth_url)
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: "{{ service_name }}-secrets"
  namespace: "{{ namespace }}"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: "{{ service_name }}-secrets"
    creationPolicy: Owner
  data:
    # JWT
    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: secret/aivo/auth
        property: jwt_public_key
    - secretKey: INTERNAL_API_KEY
      remoteRef:
        key: secret/aivo/auth
        property: internal_api_key
    # Database (service-specific)
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/aivo/database
        property: "{{ db_key }}"
    # Redis
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/aivo/redis
        property: url
    # NATS
    - secretKey: NATS_URL
      remoteRef:
        key: secret/aivo/nats
        property: url
