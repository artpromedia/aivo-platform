apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-engine
  namespace: aivo-prod
  labels:
    app: brain-engine
    tier: python-light
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brain-engine
  template:
    metadata:
      labels:
        app: brain-engine
        tier: python-light
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: brain-engine
          image: aivo/brain-engine:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: python-ai-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: brain-engine
  namespace: aivo-prod
spec:
  selector:
    app: brain-engine
  ports:
    - port: 8080
      targetPort: 8080
