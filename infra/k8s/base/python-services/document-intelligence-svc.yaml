apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-intelligence-svc
  namespace: aivo-prod
  labels:
    app: document-intelligence-svc
    tier: python-medium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-intelligence-svc
  template:
    metadata:
      labels:
        app: document-intelligence-svc
        tier: python-medium
    spec:
      containers:
        - name: document-intelligence-svc
          image: aivo/document-intelligence-svc
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: python-ai-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: python-ai-secrets
                  key: documents-database-url
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1000m"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: document-intelligence-svc
  namespace: aivo-prod
spec:
  selector:
    app: document-intelligence-svc
  ports:
    - port: 8080
      targetPort: 8080
