apiVersion: apps/v1
kind: Deployment
metadata:
  name: peer-learning-svc
  namespace: aivo-prod
  labels:
    app: peer-learning-svc
    tier: python-medium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peer-learning-svc
  template:
    metadata:
      labels:
        app: peer-learning-svc
        tier: python-medium
    spec:
      containers:
        - name: peer-learning-svc
          image: aivo/peer-learning-svc
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: python-ai-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1000m"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: peer-learning-svc
  namespace: aivo-prod
spec:
  selector:
    app: peer-learning-svc
  ports:
    - port: 8000
      targetPort: 8000
