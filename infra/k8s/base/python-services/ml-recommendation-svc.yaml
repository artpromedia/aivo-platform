apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-recommendation-svc
  namespace: aivo-prod
  labels:
    app: ml-recommendation-svc
    tier: python-medium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-recommendation-svc
  template:
    metadata:
      labels:
        app: ml-recommendation-svc
        tier: python-medium
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ml-recommendation-svc
          image: aivo/ml-recommendation-svc:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: python-ai-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: python-ai-secrets
                  key: recommendations-database-url
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1000m"
              memory: 1Gi
              ephemeral-storage: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ml-recommendation-svc
  namespace: aivo-prod
spec:
  selector:
    app: ml-recommendation-svc
  ports:
    - port: 8000
      targetPort: 8000
