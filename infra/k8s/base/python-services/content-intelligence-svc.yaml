apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-intelligence-svc
  namespace: aivo-prod
  labels:
    app: content-intelligence-svc
    tier: python-medium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: content-intelligence-svc
  template:
    metadata:
      labels:
        app: content-intelligence-svc
        tier: python-medium
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: content-intelligence-svc
          image: aivo/content-intelligence-svc:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: python-ai-secrets
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1000m"
              memory: 2Gi
              ephemeral-storage: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: content-intelligence-svc
  namespace: aivo-prod
spec:
  selector:
    app: content-intelligence-svc
  ports:
    - port: 8000
      targetPort: 8000
