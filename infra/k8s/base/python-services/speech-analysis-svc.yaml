apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-analysis-svc
  namespace: aivo-prod
  labels:
    app: speech-analysis-svc
    tier: python-medium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speech-analysis-svc
  template:
    metadata:
      labels:
        app: speech-analysis-svc
        tier: python-medium
    spec:
      containers:
        - name: speech-analysis-svc
          image: aivo/speech-analysis-svc
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: python-ai-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: python-ai-secrets
                  key: speech-database-url
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1000m"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: speech-analysis-svc
  namespace: aivo-prod
spec:
  selector:
    app: speech-analysis-svc
  ports:
    - port: 8080
      targetPort: 8080
