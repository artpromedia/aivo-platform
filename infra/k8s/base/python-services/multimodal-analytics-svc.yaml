apiVersion: apps/v1
kind: Deployment
metadata:
  name: multimodal-analytics-svc
  namespace: aivo-prod
  labels:
    app: multimodal-analytics-svc
    tier: python-medium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multimodal-analytics-svc
  template:
    metadata:
      labels:
        app: multimodal-analytics-svc
        tier: python-medium
    spec:
      containers:
        - name: multimodal-analytics-svc
          image: aivo/multimodal-analytics-svc
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: python-ai-secrets
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1500m"
              memory: 3Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: multimodal-analytics-svc
  namespace: aivo-prod
spec:
  selector:
    app: multimodal-analytics-svc
  ports:
    - port: 8000
      targetPort: 8000
