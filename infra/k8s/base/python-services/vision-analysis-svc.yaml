apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-analysis-svc
  namespace: aivo-prod
  labels:
    app: vision-analysis-svc
    tier: python-heavy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vision-analysis-svc
  template:
    metadata:
      labels:
        app: vision-analysis-svc
        tier: python-heavy
    spec:
      containers:
        - name: vision-analysis-svc
          image: aivo/vision-analysis-svc
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: python-ai-secrets
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: "2000m"
              memory: 6Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: model-cache
              mountPath: /app/models
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vision-analysis-svc
  namespace: aivo-prod
spec:
  selector:
    app: vision-analysis-svc
  ports:
    - port: 8000
      targetPort: 8000
