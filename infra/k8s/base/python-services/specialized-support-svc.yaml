apiVersion: apps/v1
kind: Deployment
metadata:
  name: specialized-support-svc
  namespace: aivo-prod
  labels:
    app: specialized-support-svc
    tier: python-light
spec:
  replicas: 1
  selector:
    matchLabels:
      app: specialized-support-svc
  template:
    metadata:
      labels:
        app: specialized-support-svc
        tier: python-light
    spec:
      containers:
        - name: specialized-support-svc
          image: aivo/specialized-support-svc
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: python-ai-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: specialized-support-svc
  namespace: aivo-prod
spec:
  selector:
    app: specialized-support-svc
  ports:
    - port: 8000
      targetPort: 8000
