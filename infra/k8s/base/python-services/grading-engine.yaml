apiVersion: apps/v1
kind: Deployment
metadata:
  name: grading-engine
  namespace: aivo-prod
  labels:
    app: grading-engine
    tier: python-medium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grading-engine
  template:
    metadata:
      labels:
        app: grading-engine
        tier: python-medium
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: grading-engine
          image: aivo/grading-engine:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: python-ai-secrets
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1000m"
              memory: 1Gi
              ephemeral-storage: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: grading-engine
  namespace: aivo-prod
spec:
  selector:
    app: grading-engine
  ports:
    - port: 8080
      targetPort: 8080
