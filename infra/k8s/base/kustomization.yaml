# =============================================================================
# AIVO Platform - Kustomize Base Configuration
# =============================================================================
# Base configuration for all environments. Use overlays to customize per env.
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Override namespace to aivo-prod for deployment
namespace: aivo-prod

# Common labels applied to all resources (except selectors)
# Note: Using commonLabels with kustomize adds labels to selectors which
# makes them immutable. For existing deployments, use kubectl patch instead.
# commonLabels:
#   app.kubernetes.io/part-of: aivo-platform
#   app.kubernetes.io/managed-by: kustomize

# Core services deployed to all environments
resources:
  # Namespace
  - namespace.yaml
  # Core authentication and user services
  - auth-svc.yaml
  - session-svc.yaml
  - consent-svc.yaml
  - profile-svc.yaml
  # Content and learning services
  - content-svc.yaml
  - assessment-svc.yaml
  - personalization-svc.yaml
  - life-skills-svc.yaml
  # AI and analytics
  - ai-orchestrator.yaml
  - analytics-svc.yaml
  # Communication services
  - notify-svc.yaml
  - messaging-svc.yaml
  # Goal and focus tracking
  - goal-svc.yaml
  - focus-svc.yaml
  # Billing and payments
  - billing-svc.yaml
  - payments-svc.yaml
  # Parent portal
  - parent-svc.yaml
  - baseline-svc.yaml

  #  Python AI/ML Services 
  #  Heavy (large model loading  pin to i9-9900K via nodeSelector)
  - python-services/training-svc.yaml
  - python-services/vision-analysis-svc.yaml
  - python-services/accessibility-ai-svc.yaml
  - python-services/question-generation-svc.yaml
  #  Medium (smaller models  scikit-learn, sentence-transformers)
  - python-services/ml-recommendation-svc.yaml
  - python-services/speech-analysis-svc.yaml
  - python-services/writing-assessment-svc.yaml
  - python-services/content-intelligence-svc.yaml
  - python-services/knowledge-graph-svc.yaml
  - python-services/multimodal-analytics-svc.yaml
  - python-services/document-intelligence-svc.yaml
  - python-services/peer-learning-svc.yaml
  - python-services/grading-engine.yaml
  #  Light (API proxies, math-only, minimal resources)
  - python-services/ai-inference-svc.yaml
  - python-services/brain-engine.yaml
  - python-services/python-api-gateway.yaml
  - python-services/specialized-support-svc.yaml
  - python-services/rl-tutoring-svc.yaml
  - python-services/cognitive-load-svc.yaml
  - python-services/curriculum-py-svc.yaml
