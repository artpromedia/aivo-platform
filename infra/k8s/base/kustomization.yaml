# =============================================================================
# AIVO Platform - Kustomize Base Configuration
# =============================================================================
# Base configuration for all environments. Use overlays to customize per env.
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/part-of: aivo-platform
  app.kubernetes.io/managed-by: kustomize

# Core services deployed to all environments
resources:
  # Namespace
  - namespace.yaml
  # Core authentication and user services
  - auth-svc.yaml
  - session-svc.yaml
  - consent-svc.yaml
  - profile-svc.yaml
  # Content and learning services
  - content-svc.yaml
  - assessment-svc.yaml
  - personalization-svc.yaml
  - life-skills-svc.yaml
  # AI and analytics
  - ai-orchestrator.yaml
  - analytics-svc.yaml
  # Communication services
  - notify-svc.yaml
  - messaging-svc.yaml
  # Goal and focus tracking
  - goal-svc.yaml
  - focus-svc.yaml
  # Billing and payments
  - billing-svc.yaml
  - payments-svc.yaml
  # Parent portal
  - parent-svc.yaml
  - baseline-svc.yaml
