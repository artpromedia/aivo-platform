# ==============================================================================
# AIVO Platform - Audit Service Kubernetes Deployment
# ==============================================================================
# Immutable audit logging service for compliance and security

apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-svc
  namespace: aivo
  labels:
    app: audit-svc
    component: backend
    tier: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-svc
  template:
    metadata:
      labels:
        app: audit-svc
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: audit-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1000
      containers:
        - name: audit-svc
          image: aivo/audit-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shared-secrets
                  key: database-url
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-keys
                  key: public-key
                  optional: true
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: internal-api-keys
                  key: audit-svc
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: shared-secrets
                  key: redis-url
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: shared-secrets
                  key: nats-url
            - name: NATS_ENABLED
              value: "true"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: audit-svc
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: audit-svc
  namespace: aivo
  labels:
    app: audit-svc
spec:
  type: ClusterIP
  ports:
    - port: 4050
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: audit-svc

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-svc
  namespace: aivo

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audit-svc
  namespace: aivo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audit-svc
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
