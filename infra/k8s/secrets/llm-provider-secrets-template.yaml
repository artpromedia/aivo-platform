# ============================================================================
# LLM Provider Secrets Template
# ============================================================================
#
# DO NOT commit actual secret values to version control!
#
# This secret contains API keys for LLM providers used by the AI Orchestrator.
#
# Provider Priority (Production):
#   1. Google Gemini (PRIMARY) - Cost-effective, fast
#   2. OpenAI (FALLBACK 1) - Reliable, high quality
#   3. Anthropic (FALLBACK 2) - Safety-focused, good for educational content
#
# Usage:
#   1. Copy this file to llm-provider-secrets.yaml (gitignored)
#   2. Replace placeholder values with actual API keys
#   3. Apply with: kubectl apply -f llm-provider-secrets.yaml
#
# For production, use K8s native Secrets:
#   - Apply secrets via kubectl on the Hetzner K3s cluster
#   - Or use External Secrets Operator with your preferred backend
#
# ============================================================================

---
apiVersion: v1
kind: Secret
metadata:
  name: llm-provider-secrets
  namespace: aivo
  labels:
    app.kubernetes.io/name: ai-orchestrator
    app.kubernetes.io/component: llm-secrets
    app.kubernetes.io/part-of: aivo
type: Opaque
stringData:
  # ═══════════════════════════════════════════════════════════════════════════
  # Google Gemini (PRIMARY)
  # ═══════════════════════════════════════════════════════════════════════════
  # Get API key from: https://aistudio.google.com/app/apikey
  # Or use Vertex AI with a service account key
  google-gemini-api-key: "REPLACE_WITH_GOOGLE_GEMINI_API_KEY"
  google-project-id: "aivo-production"

  # ═══════════════════════════════════════════════════════════════════════════
  # OpenAI (FALLBACK 1)
  # ═══════════════════════════════════════════════════════════════════════════
  # Get API key from: https://platform.openai.com/api-keys
  openai-api-key: "REPLACE_WITH_OPENAI_API_KEY"
  openai-organization-id: ""  # Optional: your OpenAI org ID

  # ═══════════════════════════════════════════════════════════════════════════
  # Anthropic (FALLBACK 2)
  # ═══════════════════════════════════════════════════════════════════════════
  # Get API key from: https://console.anthropic.com/
  anthropic-api-key: "REPLACE_WITH_ANTHROPIC_API_KEY"

---
# ============================================================================
# AI Orchestrator Service-Specific Secrets
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: ai-orchestrator-secrets
  namespace: aivo
  labels:
    app.kubernetes.io/name: ai-orchestrator
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database URL (if applicable)
  database-url: "postgresql://aivo:REPLACE_PASSWORD@postgres.aivo-infra.svc.cluster.local:5432/aivo_ai_orchestrator"

  # Internal API key for service-to-service authentication
  # Generate with: openssl rand -base64 32
  internal-api-key: "REPLACE_WITH_SECURE_INTERNAL_API_KEY"

---
