apiVersion: v1
kind: Secret
metadata:
  name: aivo-auth-secrets
  namespace: aivo
  labels:
    app.kubernetes.io/part-of: aivo-platform
    app.kubernetes.io/component: auth
  annotations:
    description: >-
      Shared auth secrets for all AIVO Platform services.
      Contains the RS256 JWT public key and internal API key
      used by @aivo/ts-rbac and aivo-py-common auth modules.
type: Opaque
stringData:
  # RS256 JWT Public Key (PEM-encoded)
  # This is the public key counterpart of the private key used by auth-svc
  # to sign JWTs. All services use this to verify incoming tokens.
  # Generate with: openssl genrsa -out private.pem 2048
  #                openssl rsa -in private.pem -pubout -out public.pem
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_ACTUAL_PUBLIC_KEY
    -----END PUBLIC KEY-----

  # Internal API key for service-to-service authentication
  # Generate with: openssl rand -hex 32
  INTERNAL_API_KEY: "REPLACE_WITH_INTERNAL_API_KEY"
