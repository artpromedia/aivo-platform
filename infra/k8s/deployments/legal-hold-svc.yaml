# ============================================================================
# Legal Hold Service
# E-discovery and litigation hold management for compliance
# ============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: legal-hold-svc-config
  namespace: aivo
  labels:
    app.kubernetes.io/name: legal-hold-svc
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "4061"
  HOST: "0.0.0.0"
  # Legal hold-specific configuration
  EMAIL_ENABLED: "true"
  DEFAULT_REMINDER_DAYS: "7"
  DEFAULT_ESCALATION_DAYS: "14"
  AUDIT_LOG_RETENTION_YEARS: "7"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-hold-svc
  namespace: aivo
  labels:
    app.kubernetes.io/name: legal-hold-svc
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: aivo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: legal-hold-svc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legal-hold-svc
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: legal-hold-svc
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: legal-hold-svc
          image: aivo/legal-hold-svc:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 4061
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          envFrom:
            - configMapRef:
                name: legal-hold-svc-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: legal-hold-svc-secrets
                  key: database-url
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: legal-hold-svc-secrets
                  key: smtp-host
                  optional: true
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: shared-secrets
                  key: redis-url
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: shared-secrets
                  key: nats-url

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.cache

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: legal-hold-svc
                topologyKey: kubernetes.io/hostname

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: legal-hold-svc

---
apiVersion: v1
kind: Service
metadata:
  name: legal-hold-svc
  namespace: aivo
  labels:
    app.kubernetes.io/name: legal-hold-svc
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4061
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: legal-hold-svc

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: legal-hold-svc
  namespace: aivo
  labels:
    app.kubernetes.io/name: legal-hold-svc

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: legal-hold-svc
  namespace: aivo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: legal-hold-svc
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: legal-hold-svc
  namespace: aivo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: legal-hold-svc

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: legal-hold-svc-network-policy
  namespace: aivo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: legal-hold-svc
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: aivo-gateway
      ports:
        - protocol: TCP
          port: 4061
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4061
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              name: aivo-infra
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
