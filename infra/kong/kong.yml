      - /api/v1/gradebook
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    strip_path: false
    service: gradebook-svc
    plugins:
      - name: jwt
      - name: dash_context
      - name: learner_scope
        config:
          auth_service_url: http://host.docker.internal:3010
          cache_ttl: 300
      - name: rate-limiting
        config:
          minute: 300
          policy: redis
          redis_host: redis
          redis_port: 6379

  # ---------------------------------------------------------------------------
  # Writing Pad Routes (Writing exercises)
  # ---------------------------------------------------------------------------
  - name: writing-pad-routes
    paths:
      - /api/v1/writing
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    strip_path: false
    service: writing-pad-svc
    plugins:
      - name: jwt
      - name: dash_context
      - name: rate-limiting
        config:
          minute: 300
          policy: redis
          redis_host: redis
          redis_port: 6379

# =============================================================================
# CONSUMERS - API consumers (tenants/users with rate limit tiers)
# =============================================================================
consumers:
  # Default consumer for authenticated requests
  - username: default
    custom_id: default
    tags:
      - tier:free

# =============================================================================
# PLUGINS - Global plugins applied to all routes
# =============================================================================
plugins:
  # ---------------------------------------------------------------------------
  # Correlation ID (global)
  # ---------------------------------------------------------------------------
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid#counter
      echo_downstream: true

  # ---------------------------------------------------------------------------
  # Prometheus Metrics (global)
  # ---------------------------------------------------------------------------
  - name: prometheus
    config:
      per_consumer: true
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  # ---------------------------------------------------------------------------
  # Response Transformer - Add security headers (global)
  # ---------------------------------------------------------------------------
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Content-Type-Options: nosniff"
          - "X-Frame-Options: DENY"
          - "X-XSS-Protection: 1; mode=block"
          - "Strict-Transport-Security: max-age=31536000; includeSubDomains"

  # ---------------------------------------------------------------------------
  # Request Size Limiting (global)
  # ---------------------------------------------------------------------------
  - name: request-size-limiting
    config:
      allowed_payload_size: 10  # MB
      size_unit: megabytes
