# =============================================================================
# UPSTREAMS - Load balancing and health checks
# =============================================================================
upstreams:
  # ---------------------------------------------------------------------------
  # AI Orchestrator with Failover
  # ---------------------------------------------------------------------------
  - name: ai-orchestrator-upstream
    algorithm: round-robin
    healthchecks:
      active:
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
        http_path: /health
        timeout: 5
        type: http
      passive:
        healthy:
          successes: 2
        unhealthy:
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
        type: http
    targets:
      - target: host.docker.internal:3100
        weight: 100
        tags:
          - primary
      - target: host.docker.internal:3101
        weight: 0  # Only used on failover
        tags:
          - fallback

# =============================================================================
# ROUTES - Request routing rules
# =============================================================================
routes:
  # ---------------------------------------------------------------------------
  # Health Check (no auth required)
  # ---------------------------------------------------------------------------
  - name: health-check
    paths:
      - /health
    methods:
      - GET
    strip_path: false
    service: auth-svc  # Any service can respond to health
    plugins:
      - name: request-termination
        config:
          status_code: 200
          message: '{"status":"ok","gateway":"kong"}'
          content_type: application/json

  # ---------------------------------------------------------------------------
  # Auth Routes (public)
  # ---------------------------------------------------------------------------
  - name: auth-public
    paths:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/refresh
      - /api/v1/auth/sso
      - /api/v1/auth/saml
    methods:
      - GET
      - POST
    strip_path: false
    service: auth-svc
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: redis
          redis_host: redis
          redis_port: 6379

  # ---------------------------------------------------------------------------
  # Auth Routes (authenticated)
  # ---------------------------------------------------------------------------
  - name: auth-protected
    paths:
      - /api/v1/auth
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    strip_path: false
    service: auth-svc
