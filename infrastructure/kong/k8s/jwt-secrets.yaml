apiVersion: v1
kind: Secret
metadata:
  name: kong-jwt-secrets
  namespace: kong
type: Opaque
data:
  # JWT configuration for Kong
  # Base64 encoded RSA public key for JWT validation
  jwt_public_key: ""
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: jwt-validation
  namespace: kong
config:
  key_claim_name: kid
  claims_to_verify:
    - exp
    - nbf
  run_on_preflight: false
plugin: jwt
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: cors-global
  namespace: kong
config:
  origins:
    - "*"
  methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  headers:
    - Accept
    - Authorization
    - Content-Type
    - X-Correlation-ID
    - X-Tenant-ID
  exposed_headers:
    - X-Correlation-ID
  credentials: true
  max_age: 3600
plugin: cors
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: request-transformer
  namespace: kong
config:
  add:
    headers:
      - "X-Gateway-Version:1.0"
plugin: request-transformer
