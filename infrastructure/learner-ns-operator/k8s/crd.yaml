apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: learnernamespaces.aivo.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: aivo.io
  names:
    kind: LearnerNamespace
    listKind: LearnerNamespaceList
    plural: learnernamespaces
    singular: learnernamespace
    shortNames:
      - lns
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenantId
        - name: Learner
          type: string
          jsonPath: .spec.learnerId
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Namespace
          type: string
          jsonPath: .status.namespaceName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - tenantId
                - learnerId
              properties:
                tenantId:
                  type: string
                  description: Tenant identifier
                learnerId:
                  type: string
                  description: Learner identifier
                displayName:
                  type: string
                  description: Human-readable name
                tier:
                  type: string
                  enum: [free, standard, premium]
                  default: standard
                resourceQuota:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    storage:
                      type: string
                    pods:
                      type: integer
                      format: int32
                    services:
                      type: integer
                      format: int32
                    secrets:
                      type: integer
                      format: int32
                    configMaps:
                      type: integer
                      format: int32
                    persistentVolumeClaims:
                      type: integer
                      format: int32
                networkPolicies:
                  type: boolean
                  default: true
                allowedImages:
                  type: array
                  items:
                    type: string
                labels:
                  type: object
                  additionalProperties:
                    type: string
                annotations:
                  type: object
                  additionalProperties:
                    type: string
                ttl:
                  type: string
                  description: Time-to-live duration string (e.g., "24h", "7d")
                autoCleanup:
                  type: boolean
                  default: false
                idleTimeout:
                  type: string
                  description: Idle timeout duration for cleanup
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Creating, Active, Terminating, Failed]
                namespaceName:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                resourceUsage:
                  type: object
                  properties:
                    cpuUsed:
                      type: string
                    memoryUsed:
                      type: string
                    storageUsed:
                      type: string
                    podsUsed:
                      type: integer
                      format: int32
                lastActivityTime:
                  type: string
                  format: date-time
                createdAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time
