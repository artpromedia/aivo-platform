# =============================================================================
# Gitleaks Configuration for AIVO Platform
# =============================================================================
#
# Customizes secret detection to reduce false positives while still catching
# real secrets. This config is automatically used by gitleaks/gitleaks-action@v2.
#
# False positive categories addressed:
#   1. Firebase API keys (public by design, restricted by bundleId/SHA)
#   2. Test Stripe keys (sk_test_placeholder, pk_test_placeholder, etc.)
#   3. Dev-only secrets in .env.example files (not real credentials)
#   4. Test fixture private keys (fake/truncated keys in test files)
#   5. K8s secret templates with REPLACE_WITH_* placeholders
#   6. Common-password blocklist (breach corpus, not credentials)
#   7. Documentation files with example/truncated API keys and JWTs
#   8. Dev portal pages with placeholder API keys in code examples
#   9. Dev environment config (config/environments/development.env)
#
# NOTE: Real secrets in scripts/hetzner/ have been refactored to use
#   environment variables. Hardcoded credentials have been removed.

title = "AIVO Gitleaks Configuration"

[extend]
# Extend the default gitleaks config so we still detect real secrets
useDefault = true

[allowlist]
description = "Global allowlist for known false positives"

# Paths that commonly contain test/example values
paths = [
  '''\.env\.example$''',
  '''\.env\.test$''',
  '''\.env\.sample$''',
  '''\.env\.template$''',
  '''infra/k8s/secrets/.*-template\.yaml$''',
  '''infra/k8s/secrets/staging-secrets\.yaml$''',
]

# Regex patterns for known safe values
regexes = [
  # Placeholder/template values (not real secrets)
  '''(?i)REPLACE_ME''',
  '''(?i)REPLACE_WITH_''',
  '''(?i)YOUR_.*_KEY''',
  '''(?i)your-.*-key''',
  '''(?i)change-this''',
  '''(?i)change-me''',
  '''(?i)placeholder''',
  '''(?i)REDACTED''',
  '''(?i)XXXX''',
  '''(?i)dev-only-not-for-production''',
  '''(?i)dev-internal-key''',
  '''(?i)not-for-production''',
  # Test/CI-specific fake keys
  '''sk_test_fake_key_for_ci''',
  '''sk_test_mock''',
  '''pk_test_mock''',
  # MinIO default creds in dev/test configs
  '''minioadmin''',
  # Test JWT secrets
  '''test-secret-key-for-ci-do-not-use-in-production''',
]

# ─────────────────────────────────────────────────────────────────────────────
# Per-path allowlists (merged into rule-specific sections below)
# ─────────────────────────────────────────────────────────────────────────────

# Test Stripe keys in test files, config defaults, CI workflows, and docker-compose
[[rules]]
id = "stripe-access-token"
description = "Stripe Access Token"
[rules.allowlist]
regexes = [
  '''sk_test_[A-Za-z0-9_-]*(?:placeholder|REPLACE|REDACTED|fake|mock|YOUR)''',
  '''pk_test_[A-Za-z0-9_-]*(?:placeholder|REPLACE|REDACTED|fake|mock|YOUR|XXXX)''',
  '''rk_test_[A-Za-z0-9_-]*(?:placeholder|REPLACE|REDACTED|fake|mock|YOUR)''',
]
paths = [
  '''\.env\.example$''',
  '''docker/''',
  '''infra/''',
  '''\.github/workflows/''',
  '''scripts/hetzner/(?:deploy|patch|update)_''',
  '''tests/''',
  '''test/''',
  '''__tests__/''',
]

# Generic API keys in dev/test contexts
[[rules]]
id = "generic-api-key"
description = "Generic API Key"
[rules.allowlist]
paths = [
  '''\.env\.example$''',
  '''\.env\.test$''',
  '''\.env\.sample$''',
  '''\.env\.template$''',
  '''\.test\.ts$''',
  '''\.spec\.ts$''',
  '''__tests__/''',
  '''/test/''',
  '''/tests/''',
  '''fixtures/''',
  '''mocks/''',
  '''docker/docker-compose\.yml$''',
  '''docker/\.env\.example$''',
  '''infra/k8s/secrets/''',
  '''\.github/workflows/''',
  '''scripts/hetzner/(?:deploy|patch|update)_''',
  # Common-password blocklist (breach corpus for validation, not real creds)
  '''services/auth-svc/src/data/common-passwords\.ts$''',
  # Dev-only environment config (placeholder values)
  '''config/environments/development\.env$''',
  # Dev portal example/demo code
  '''apps/web-dev-portal/app/.*\.tsx$''',
  '''apps/web-dev-portal/public/.*\.(json|yaml)$''',
  '''apps/web-dev-portal/__tests__/''',
  # Documentation files with example API keys
  '''docs/.*\.md$''',
  '''.*README\.md$''',
  '''MOBILE_APPS_PRODUCTION_READINESS\.md$''',
  '''DEPLOYMENT_GUIDE\.md$''',
  '''CONTRIBUTING\.md$''',
  '''SDK_GUIDELINES\.md$''',
  '''SECURITY_AUDIT_CHECKLIST\.md$''',
  '''.*_AUDIT.*\.md$''',
  '''.*_REPORT.*\.md$''',
  '''.*IMPLEMENTATION.*\.md$''',
  '''.*SPRINT.*\.md$''',
  '''HETZNER_DEPLOYMENT_GUIDE\.md$''',
]
regexes = [
  '''(?i)placeholder''',
  '''(?i)REPLACE''',
  '''(?i)REDACTED''',
  '''(?i)change-this''',
  '''(?i)change-me''',
  '''(?i)dev-only''',
  '''(?i)not-for-production''',
  '''minioadmin''',
  '''SG\.xxx''',
  '''sk-REPLACE_ME''',
  '''sk-ant-REPLACE_ME''',
  '''YOUR_API_KEY''',
  '''your-api-key''',
  '''your-key''',
  '''aivo_sk_test_''',
  '''aivo_sk_live_xxx''',
  '''sk-\.\.\.''',
  '''sk-ant-\.\.\.''',
  '''AIza\.\.\.''',
]

# Documentation JWT examples (truncated, not real tokens)
[[rules]]
id = "jwt"
description = "JWT Token"
[rules.allowlist]
paths = [
  '''docs/.*\.md$''',
  '''apps/web-dev-portal/''',
  '''.*README\.md$''',
  '''.*_AUDIT.*\.md$''',
  '''.*_REPORT.*\.md$''',
]

# GCP API key examples in docs (truncated AIza... prefixes)
[[rules]]
id = "gcp-api-key"
description = "GCP API key"
[rules.allowlist]
paths = [
  '''firebase_options\.dart$''',
  '''.*README\.md$''',
  '''docs/.*\.md$''',
  '''MOBILE_APPS_PRODUCTION_READINESS\.md$''',
]

# Curl auth header examples in documentation
[[rules]]
id = "curl-auth-header"
description = "Curl Auth Header"
[rules.allowlist]
paths = [
  '''docs/.*\.md$''',
  '''apps/web-dev-portal/''',
  '''.*README\.md$''',
]

# Private keys in refactored hetzner scripts (now using env vars, no real keys)
[[rules]]
id = "private-key"
description = "Private Key"
[rules.allowlist]
paths = [
  '''\.test\.ts$''',
  '''\.spec\.ts$''',
  '''__tests__/''',
  '''/test/''',
  '''/tests/''',
  '''fixtures/''',
  '''mocks/''',
  '''\.env\.example$''',
  '''\.env\.test$''',
  '''infra/k8s/secrets/.*-template\.yaml$''',
  '''infra/k8s/secrets/staging-secrets\.yaml$''',
  '''\.github/workflows/''',
  '''docs/.*\.md$''',
]
