apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-collector-svc
  labels:
    app: event-collector-svc
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: event-collector-svc
  template:
    metadata:
      labels:
        app: event-collector-svc
        tier: backend
    spec:
      serviceAccountName: event-collector-svc
      containers:
        - name: event-collector-svc
          image: aivo/event-collector-svc:latest
          ports:
            - containerPort: 4060
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4060"
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: event-collector-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: event-collector-secrets
                  key: redis-url
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: event-collector-config
                  key: nats-url
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: event-collector-secrets
                  key: internal-api-key
            - name: JWT_PUBLIC_KEY_PATH
              value: "/secrets/jwt/jwt-public.pem"
          volumeMounts:
            - name: jwt-keys
              mountPath: /secrets/jwt
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: event-collector-svc
  labels:
    app: event-collector-svc
spec:
  type: ClusterIP
  ports:
    - port: 4060
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: event-collector-svc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-collector-svc
  labels:
    app: event-collector-svc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-collector-config
data:
  nats-url: "nats://nats:4222"
  batch-size: "100"
  batch-concurrency: "4"
  worker-concurrency: "10"
