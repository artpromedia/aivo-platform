apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-svc
  labels:
    app: orchestrator-svc
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orchestrator-svc
  template:
    metadata:
      labels:
        app: orchestrator-svc
    spec:
      containers:
        - name: orchestrator-svc
          image: aivo/orchestrator-svc:latest
          ports:
            - containerPort: 4075
          envFrom:
            - configMapRef:
                name: orchestrator-svc-config
            - secretRef:
                name: orchestrator-svc-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4075
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4075
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-svc
spec:
  selector:
    app: orchestrator-svc
  ports:
    - port: 80
      targetPort: 4075
