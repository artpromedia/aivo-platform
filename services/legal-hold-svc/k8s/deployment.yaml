apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-hold-svc
  labels:
    app: legal-hold-svc
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legal-hold-svc
  template:
    metadata:
      labels:
        app: legal-hold-svc
        tier: backend
    spec:
      serviceAccountName: legal-hold-svc
      containers:
        - name: legal-hold-svc
          image: aivo/legal-hold-svc:latest
          ports:
            - containerPort: 4061
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4061"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: legal-hold-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: legal-hold-secrets
                  key: redis-url
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: legal-hold-config
                  key: nats-url
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: legal-hold-secrets
                  key: internal-api-key
            - name: JWT_PUBLIC_KEY_PATH
              value: "/secrets/jwt/jwt-public.pem"
            - name: EMAIL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: legal-hold-config
                  key: email-enabled
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: legal-hold-secrets
                  key: smtp-host
                  optional: true
          volumeMounts:
            - name: jwt-keys
              mountPath: /secrets/jwt
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: legal-hold-svc
  labels:
    app: legal-hold-svc
spec:
  type: ClusterIP
  ports:
    - port: 4061
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: legal-hold-svc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: legal-hold-svc
  labels:
    app: legal-hold-svc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: legal-hold-config
data:
  nats-url: "nats://nats:4222"
  email-enabled: "true"
  default-reminder-days: "7"
  default-escalation-days: "14"
