apiVersion: apps/v1
kind: Deployment
metadata:
  name: iep-svc
  labels:
    app: iep-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iep-svc
  template:
    metadata:
      labels:
        app: iep-svc
    spec:
      serviceAccountName: iep-svc
      containers:
        - name: iep-svc
          image: aivo/iep-svc:latest
          ports:
            - containerPort: 4070
          envFrom:
            - configMapRef:
                name: iep-svc-config
            - secretRef:
                name: iep-svc-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4070
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 4070
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: iep-svc
spec:
  selector:
    app: iep-svc
  ports:
    - port: 80
      targetPort: 4070
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iep-svc
