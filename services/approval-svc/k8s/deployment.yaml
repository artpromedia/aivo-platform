apiVersion: apps/v1
kind: Deployment
metadata:
  name: approval-svc
  labels:
    app: approval-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: approval-svc
  template:
    metadata:
      labels:
        app: approval-svc
    spec:
      containers:
        - name: approval-svc
          image: aivo/approval-svc:latest
          ports:
            - containerPort: 4076
          envFrom:
            - configMapRef:
                name: approval-svc-config
            - secretRef:
                name: approval-svc-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4076
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4076
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: approval-svc
spec:
  selector:
    app: approval-svc
  ports:
    - port: 80
      targetPort: 4076
