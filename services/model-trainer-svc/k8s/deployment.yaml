apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-trainer-svc
  labels:
    app: model-trainer-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: model-trainer-svc
  template:
    metadata:
      labels:
        app: model-trainer-svc
    spec:
      containers:
        - name: model-trainer-svc
          image: aivo/model-trainer-svc:latest
          ports:
            - containerPort: 4073
          envFrom:
            - configMapRef:
                name: model-trainer-svc-config
            - secretRef:
                name: model-trainer-svc-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4073
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4073
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: model-trainer-svc
spec:
  selector:
    app: model-trainer-svc
  ports:
    - port: 80
      targetPort: 4073
