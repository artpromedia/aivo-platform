apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-svc
  labels:
    app: search-svc
spec:
  replicas: 3
  selector:
    matchLabels:
      app: search-svc
  template:
    metadata:
      labels:
        app: search-svc
    spec:
      containers:
        - name: search-svc
          image: aivo/search-svc:latest
          ports:
            - containerPort: 4074
          envFrom:
            - configMapRef:
                name: search-svc-config
            - secretRef:
                name: search-svc-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4074
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4074
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: search-svc
spec:
  selector:
    app: search-svc
  ports:
    - port: 80
      targetPort: 4074
