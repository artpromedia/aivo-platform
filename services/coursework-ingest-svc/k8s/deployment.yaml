apiVersion: apps/v1
kind: Deployment
metadata:
  name: coursework-ingest-svc
  labels:
    app: coursework-ingest-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coursework-ingest-svc
  template:
    metadata:
      labels:
        app: coursework-ingest-svc
    spec:
      containers:
        - name: coursework-ingest-svc
          image: aivo/coursework-ingest-svc:latest
          ports:
            - containerPort: 4078
          envFrom:
            - configMapRef:
                name: coursework-ingest-svc-config
            - secretRef:
                name: coursework-ingest-svc-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4078
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4078
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: coursework-ingest-svc
spec:
  selector:
    app: coursework-ingest-svc
  ports:
    - port: 80
      targetPort: 4078
